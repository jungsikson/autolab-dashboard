  var cnt=function(k){return B.vis.filter(function(t){return tdTags(t,today).some(function(x){return x.k===k;});}).length;};
  if(!TD.sel){ var f=B.news[0]?'n'+B.news[0].id:(B.vis.filter(function(t){return tdNeeds(t,today);})[0]?'t'+B.vis.filter(function(t){return tdNeeds(t,today);})[0].id:null); TD.sel=f; }
  var d=new Date(), wd='일월화수목금토'[d.getDay()];
  var h='<div class="td'+(TD.open?' open':'')+'"><section class="td-list" aria-label="오늘 목록"><div class="td-head"><h1>오늘</h1><div class="td-date">'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+wd+'요일</div>'+
    '<div class="td-sum"><span class="lead">정할 것 <b>'+need+'</b></span><span>새 일 <b>'+B.news.length+'</b></span>'+[['done','끝난 것 같음'],['reply','답할 것'],['over','마감 지남'],['today','오늘 마감'],['nodue','마감 없음'],['recheck','다시 볼 날']].map(function(x){var n=cnt(x[0]);return n?'<span>'+x[1]+' <b>'+n+'</b></span>':'';}).join('')+'</div></div>';  // 09시 DM(today_counts)과 같은 항목
  h+='<div class="td-sec"><h2>새 일</h2><span>'+(B.news.length?B.news.length+'건 · 할 일로 넣을지 정하기':'없음')+'</span></div>';
  B.news.forEach(function(r){h+='<button class="td-row" aria-selected="'+(TD.sel==='n'+r.id)+'" onclick="tdPick(\'n'+r.id+'\')"><span class="td-dot on"></span><span class="td-txt"><span class="td-t1">'+tdEsc(r.hl)+'</span><span class="td-t2">'+tdEsc([r.who||r.source,r.when_label].filter(Boolean).join(' · '))+'</span></span><span class="td-due"></span></button>';});

    g.subOrder.forEach(function(sk){

  });

  h+='</section><main class="td-detail" aria-live="polite">'+tdDetail(B)+'</main></div>';

function tdPick(k){TD.sel=k;TD.pick=null;TD.open=true;tdRender();var dd=document.querySelector('.td-detail');if(dd)dd.scrollTop=0;}

function tdPath(t){var p=[],x=t,seen={};while(x&&x.parentId&&!seen[x.id]){seen[x.id]=1;x=_alFind(x.parentId);if(x)p.unshift(x.task);}return p;}
function tdNow(desc){var m=/■ 지금 상태\s*\n([\s\S]*?)(\n\s*\n|\n■|$)/.exec(desc||'');return m?m[1].split('\n').map(function(s){return s.replace(/^\s*-\s*/,'').trim();}).filter(Boolean).slice(0,4):[];}

function tdAsk(t,today){

  if(has('recheck')&&t.waitingOn==='Claude 확인') return {q:'Claude가 아직 확인하지 못했어요. 직접 볼까요?',sub:'Claude는 매일 09시 점검 때 설명의 "Claude가 확인할 일" 조건을 기록으로 대조합니다',p:'진행'};
  if(has('recheck')) return {q:t.state==='넘김'?t.waitingOn+'님이 맡았나요?':t.waitingOn+' 답이 왔나요?',sub:'왔으면 진행(새 마감), 아직이면 '+(t.state==='넘김'?'넘김':'기다림')+' 날짜를 다시',p:'진행'};
  if(has('over')) return {q:'마감이 '+tdDays(today,t.dueDate)+'일 지났어요. 끝났나요, 마감을 다시 잡을까요?',sub:'끝났으면 끝남, 아니면 진행에서 새 마감',p:'진행'};
  if(has('nodue')) return {q:'마감이 없어요. 언제까지 끝낼까요?',p:'진행'};
  if(has('today')) return {q:'오늘 마감이에요. 오늘 끝낼 수 있나요?',sub:'못 끝내면 진행에서 새 마감',p:'끝남'};
  return null;
}
function tdField(id,label,type,val,opts){
  if(type==='select') return '<label for="'+id+'">'+label+'<select id="'+id+'">'+opts.map(function(o){return '<option value="'+tdEsc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+tdEsc(o[1])+'</option>';}).join('')+'</select></label>';
  return '<label for="'+id+'">'+label+'<input id="'+id+'" type="'+type+'" value="'+tdEsc(val||'')+'"></label>';
}
function tdPeople(){var o=[['','고르기']];MP_PEOPLE.forEach(function(g){g[1].forEach(function(n){o.push([n,n+' ('+g[0]+')']);});});return o;}
function tdTopics(){
  var all=(allData._autolab||[]).filter(tdOpen), kids={}; all.forEach(function(t){if(t.parentId)kids[t.parentId]=1;});
  return [['','단발 운영 (자동)']].concat(all.filter(function(t){return kids[t.id];}).map(function(t){return [t.id,t.task];}));
}
function tdLeaves(){var all=(allData._autolab||[]).filter(tdOpen), kids={}; all.forEach(function(t){if(t.parentId)kids[t.parentId]=1;});
  return [['','고르기']].concat(all.filter(function(t){return !kids[t.id];}).map(function(t){return [t.id,'#'+t.id+' '+t.task];}));}
function tdForm(k,t,r,today){
  var f='', hint='';
  if(t){ var ev=(tdAsk(t,today)||{}).ev||[];
    if(k==='진행'){hint='끝내야 하는 날과 다음 한 걸음';f=tdField('td-due','마감','date',t.dueDate&&t.dueDate>=today?t.dueDate:'')+tdField('td-next','다음 한 걸음','text',t.nextStep||'');}
    if(k==='기다림'){hint='누구를 기다리는지, 언제 다시 볼지';f=tdField('td-who','누구','text',t.waitingOn||'')+tdField('td-recheck','다시 볼 날','date',tdAdd(today,3));}
    if(k==='넘김'){hint='누구에게 넘기는지, 수락을 언제 확인할지';f=tdField('td-who','누구','select',t.waitingOn||'',tdPeople())+tdField('td-recheck','수락 확인할 날','date',tdBiz(today));}
    if(k==='미룸'){hint='화면에 다시 나타날 날';f=tdField('td-show','보일 날','date',tdAdd(today,1));}
    if(k==='끝남'){hint='끝난 근거 한 줄이나 링크';f=tdField('td-proof','근거','text',ev[0]?ev[0].when+' '+ev[0].text:'');}
    if(k==='안 함'){hint='하지 않는 이유 한 줄';f=tdField('td-why','이유','text','');}
  } else {
    if(k==='add'){hint='큰 주제와 마감을 정하면 할 일이 됩니다';f=tdField('td-topic','큰 주제','select','',tdTopics())+tdField('td-due','마감','date',r.sug_due||'');}
    if(k==='merge'){hint='이미 있는 할 일의 소식으로 붙입니다';f=tdField('td-task','붙일 할 일','select','',tdLeaves());}
    if(k==='handoff'){hint='누구에게 넘기는지 (원문에 보낼 글은 결과에 나옵니다)';f=tdField('td-who','누구','select','',tdPeople());}
    if(k==='done_self'){hint='이미 처리했으면 한 줄 남기고 끝남으로 기록';f=tdField('td-memo','한 일','text','');}
    if(k==='done_none'){hint='하지 않는 이유';f=tdField('td-reason','이유','select','',[['','고르기']].concat(MP_REASONS.map(function(x){return [x,x];})));}
  }
  var name=t?k:(TD_NEW.filter(function(x){return x[0]===k;})[0]||[])[1];
  return '<div class="td-form"><div class="td-hint">'+tdEsc(name)+' · '+tdEsc(hint)+'</div><div class="td-fields">'+f+'</div><div class="td-end"><button class="td-btn primary" onclick="tdConfirm()"'+(TD.busy?' disabled':'')+'>'+(TD.busy?'처리 중…':tdEsc(name)+'(으)로 확정')+'</button></div></div>';
}
function tdActs(names,primary){return '<div class="td-acts">'+names.map(function(n){var k=n[0],l=n[1];return '<button class="td-btn'+(k===primary?' primary':'')+'" aria-pressed="'+(TD.pick===k)+'" onclick="TD.pick=TD.pick===\''+k+'\'?null:\''+k+'\';tdRender()">'+tdEsc(l)+'</button>';}).join('')+'</div>';}
function tdDetail(B){
  var today=B.today, k=TD.sel||'', back='<button class="td-back" onclick="tdBack()">목록으로</button>';
  if(k[0]==='n'){
    var r=MP.rows.filter(function(x){return 'n'+x.id===k;})[0]; if(!r) return '<p class="td-empty">고른 카드가 없습니다</p>';
    return '<article class="td-card">'+back+'<div class="td-path">새 일 › '+tdEsc([r.who||r.source,r.when_label].filter(Boolean).join(' · '))+'</div><h2>'+tdEsc(r.hl)+'</h2>'+
      '<div class="td-ask"><div class="td-label"><span class="td-dot on"></span>오늘 정할 것</div><p class="td-q">할 일로 넣을까요?</p>'+
      (r.quote?'<blockquote>"'+tdEsc(r.quote)+'"</blockquote>':'')+(r.body?'<blockquote>'+tdEsc(r.body)+'</blockquote>':'')+
      '<dl class="td-kv">'+(r.link?'<dt>원문</dt><dd><a href="'+tdEsc(r.link)+'" target="_blank" rel="noopener">'+tdEsc(r.link_label||'열기')+'</a></dd>':'')+(r.sug_due?'<dt>제안 마감</dt><dd>'+tdMD(r.sug_due)+(r.sug_why?' · '+tdEsc(r.sug_why):'')+'</dd>':'')+'</dl>'+
      tdActs(TD_NEW,'add')+(TD.pick?tdForm(TD.pick,null,r,today):'')+'</div></article>';
  }
  var t=k[0]==='t'?_alFind(k.slice(1)):null; if(!t) return '<p class="td-empty">왼쪽에서 카드를 고르세요</p>';
  var a=tdAsk(t,today), path=tdPath(t), now=tdNow(t.description), hist=tdHist(t.description), links=Array.isArray(t.links)?t.links:[];
  var dueTxt=t.dueDate?(t.dueDate<today&&t.state==='진행'?'<span class="over">'+tdMD(t.dueDate)+' · '+tdDays(today,t.dueDate)+'일 지남</span>':tdMD(t.dueDate)+(t.dueDate===today?' · 오늘':'')):'없음';
  var st=t.state==='진행'&&mpShowFrom(t)>today?'미룸':(t.state||'진행');
  return '<article class="td-card">'+back+'<div class="td-path">'+(path.length?path.map(tdEsc).join(' › ')+' › ':'큰 주제 없음 › ')+'#'+t.id+'</div><h2>'+tdEsc(t.task)+'</h2>'+
    '<div class="td-facts"><span>상태 <b>'+tdEsc(st)+'</b></span><span>마감 '+dueTxt+'</span>'+(t.recheckDate&&t.waitingOn?'<span>다시 볼 날 <b>'+tdMD(t.recheckDate)+'</b></span>':'')+(st==='미룸'?'<span>보일 날 <b>'+tdMD(mpShowFrom(t))+'</b></span>':'')+
    ' <button class="td-link" onclick="openAutolabDetailModal(\''+t.id+'\')">상세 창</button></div>'+
    '<div class="td-ask">'+(a?'<div class="td-label"><span class="td-dot on"></span>오늘 정할 것</div><p class="td-q">'+tdEsc(a.q)+'</p>'+(a.sub?'<div class="td-sub2">'+tdEsc(a.sub)+'</div>':''):'<div class="td-label">오늘 정할 것 없음</div><p class="td-q quiet">'+(t.waitingOn?tdEsc(t.waitingOn)+' '+(t.state==='넘김'?'수락':'답')+'을 기다리는 중 · '+tdMD(t.recheckDate)+'에 다시 봄':'마감 '+tdMD(t.dueDate)+'까지 진행 중')+'</p>')+
    (a&&a.ev&&a.ev.length?'<ul class="td-ev">'+a.ev.map(function(e){return '<li><span class="w">'+tdEsc(e.when)+'</span><span>'+tdEsc(e.text)+(e.link?' <a href="'+tdEsc(e.link)+'" target="_blank" rel="noopener">원문</a>':'')+'</span></li>';}).join('')+'</ul>':'')+
    tdActs(TD_STATES.map(function(s){return [s,s];}),a?a.p:null)+(TD.pick?tdForm(TD.pick,t,null,today):'')+'</div>'+
    '<section class="td-block"><h3>지금 상태</h3>'+(now.length||t.nextStep||t.doneWhen?'<dl class="td-kv">'+now.map(function(s,i){return '<dt>'+(i?'':'지금')+'</dt><dd>'+tdEsc(s)+'</dd>';}).join('')+
      '<dt>다음 한 걸음</dt><dd>'+(t.nextStep?tdEsc(t.nextStep)+(t.nextOwner?' · '+tdEsc(t.nextOwner):''):'<span class="td-muted">아직 없음</span>')+'</dd><dt>끝난 모습</dt><dd>'+(t.doneWhen?tdEsc(t.doneWhen):'<span class="td-muted">아직 없음</span>')+'</dd></dl>':'<p class="td-muted">설명에 지금 상태가 없습니다</p>')+'</section>'+
    (links.length?'<section class="td-block"><h3>연결</h3><ul class="td-ev">'+links.slice(0,6).map(function(u){var kind=/slack\.com/.test(u)?'슬랙':/mail\.google/.test(u)?'메일':/github\.com/.test(u)?'GitHub':/docs\.google|drive\.google/.test(u)?'구글':/notion/.test(u)?'노션':'링크';return '<li><span class="w">'+kind+'</span><span><a href="'+tdEsc(u)+'" target="_blank" rel="noopener">'+tdEsc(u.replace(/^https?:\/\//,'').slice(0,60))+'</a></span></li>';}).join('')+'</ul></section>':'')+
    (hist.length?'<section class="td-block"><h3>이력</h3><ul class="td-ev">'+hist.map(function(e){return '<li><span class="w">'+tdEsc(e.when)+'</span><span>'+tdEsc(e.text)+'</span></li>';}).join('')+'</ul></section>':'')+
    '</article>';
}
async function tdConfirm(){
  if(TD.busy) return;
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
  var k=TD.sel||'', body;
  if(k[0]==='t'){
    var to=TD.pick; body={action:'task_set',task_id:Number(k.slice(1)),to:to,by:MP.person,via:'dashboard',due:v('td-due'),next_step:v('td-next'),who:v('td-who'),recheck:v('td-recheck'),show_from:v('td-show'),proof:v('td-proof'),why:v('td-why')};
  } else {
    var a=TD.pick, lab=(TD_NEW.filter(function(x){return x[0]===a;})[0]||[])[1];
    body={id:Number(k.slice(1)),action:a,label:lab+(a==='done_none'&&v('td-reason')?' · '+v('td-reason'):''),by:MP.person,via:'dashboard',due:v('td-due'),
      task_id:a==='add'?(v('td-topic')||null):a==='merge'?(v('td-task')||null):null,person:v('td-who'),reason:v('td-reason'),memo:v('td-memo')};
  }
  TD.busy=true; tdRender();
  try{
    var out=await mpCall(body);
    if(out.already){showToast('이미 정한 카드: '+(out.row&&out.row.decision_label||''));}
    else if(!out.ok) throw new Error(out.error||'처리 실패');
    else showToast(out.label||(out.row&&out.row.decision_label)||'처리함');
    TD.pick=null; TD.sel=null; TD.open=false;
  }catch(e){showToast('실패: '+(e.message||e),6000);}
  finally{TD.busy=false; await tdLoad(true);}
}
</script>
