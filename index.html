<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육 기수 일정 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css">
<style>
:root {
  /* Caramel Design System tokens */
  --bg-canvas:  #F5F7FA;
  --bg-surface: #FFFFFF;
  --bg-subtle:  #F9FAFC;
  --text-primary:   #2F3238;
  --text-secondary: #5B5F66;
  --text-tertiary:  #8A8F96;
  --border-subtle:  #EBEDF0;
  --border-default: #E4E6EB;
  --border-strong:  #C9CDD4;
  --accent:         #FE5B1B;
  --accent-hover:   #ED4213;
  --accent-subtle:  #FFE8DF;
  /* Caramel token aliases (used by the rebuild layer) */
  --brand:         #FE5B1B;
  --brand-hover:   #FE743D;
  --brand-pressed: #ED4213;
  --brand-tint:    rgba(254,91,27,0.12);
  --brand-05:      #FFE8DF;
  --brand-shadow:  rgba(254,91,27,0.24);
  --bg-muted:      #EBEDF0;
  --bg-scrim:      rgba(0,0,0,0.32);
  --border-1:      #E4E6EB;
  --border-brand:  #FE5B1B;
  --pink-soft:     #FFCCF6;
  --font-mono:     'IBM Plex Mono','Roboto Mono',ui-monospace,'SFMono-Regular',monospace;
  --shadow-1:      0 0 8px 0 rgba(0,0,0,0.04);
  --shadow-2:      0 0 16px 0 rgba(0,0,0,0.04);
  --shadow-3:      0 0 16px 0 rgba(0,0,0,0.08);
  --shadow-brand:  0 0 12px 0 rgba(254,91,27,0.24);
  --shadow-sheet:  0 -4px 24px 0 rgba(0,0,0,0.08);
  --status-done-bg:    #EAF8F0;
  --status-done-fg:    #1B8E4D;
  --status-done-border:#C5EBD5;
  --status-overdue-bg: #FFECEC;
  --status-overdue-fg: #C8392E;
  --status-soon-bg:    #FFF3E0;
  --status-soon-fg:    #8A6D00;
  --p-do-bg:#FFE2DD;       --p-do-fg:#C8392E;
  --p-delegate-bg:#FFF3D1; --p-delegate-fg:#8A6D00;
  --p-schedule-bg:#DDEFFF; --p-schedule-fg:#0A6FB5;
  --p-eliminate-bg:#F0F1F4;--p-eliminate-fg:#6D727A;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --shadow-card: 0 0 0 1px #EBEDF0, 0 2px 12px rgba(0,0,0,0.04);
  --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  --tracking: -0.02em;
  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg-canvas);color:var(--text-primary);font-size:var(--text-sm);letter-spacing:var(--tracking)}
.header{background:#FFFFFF;color:var(--text-primary);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border-subtle)}
.header-title{font-size:var(--text-base);font-weight:600;letter-spacing:-0.02em;color:var(--text-primary)}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date-nav{display:flex;align-items:center;gap:6px}
.date-nav button{background:var(--bg-subtle);border:1px solid var(--border-default);color:var(--text-primary);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;font-size:var(--text-xs)}
.date-nav button:hover{background:var(--bg-canvas)}
.date-label{font-size:var(--text-sm);font-weight:600;min-width:160px;text-align:center;letter-spacing:-0.01em;color:var(--text-primary)}
.icon-btn{background:var(--bg-subtle);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;font-size:var(--text-xs)}
.icon-btn:hover{background:var(--bg-canvas)}
.toggle-done-btn{background:var(--bg-subtle);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;font-size:var(--text-xs)}
.toggle-done-btn.active{background:var(--accent);color:#FFFFFF;border-color:var(--accent)}
.main{padding:28px;max-width:1400px;margin:0 auto}
.tab-bar{display:flex;gap:2px;margin-bottom:28px;flex-wrap:wrap;background:var(--bg-surface);padding:4px;border-radius:24px;width:fit-content;box-shadow:var(--shadow-card)}
.tab-btn{padding:8px 18px;border-radius:20px;border:none;background:transparent;cursor:pointer;font-size:var(--text-xs);font-weight:500;color:var(--text-secondary);font-family:var(--font-sans)}
.tab-btn:hover{background:var(--bg-surface);color:var(--text-primary)}
.tab-btn.active{background:var(--accent);color:#FFFFFF;box-shadow:0 1px 4px rgba(254,91,27,0.24)}
.person-autolab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px}
.person-autolab-card{background:var(--bg-surface);border-radius:var(--radius-lg);border:none;overflow:hidden;box-shadow:var(--shadow-card)}
.person-autolab-header{padding:14px 18px;background:var(--bg-subtle);color:var(--text-primary);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle)}
.person-autolab-name{font-size:var(--text-sm);font-weight:700;letter-spacing:-0.02em;color:var(--text-primary)}
.person-autolab-body{padding:16px 18px}
.autolab-item{display:flex;align-items:flex-start;gap:8px;padding:11px 14px;border-radius:var(--radius-md);margin-bottom:8px;border:none;background:transparent;border-left:3px solid transparent}
.autolab-item.done{background:transparent}
.autolab-item.done .autolab-task-text{text-decoration:line-through;color:var(--text-tertiary)}
.autolab-item.overdue{border-left:3px solid #FC5555;background:transparent}
.autolab-item.overdue.done{border-left:3px solid var(--border-default);background:transparent}
.autolab-item.due-soon{border-left:3px solid #F2A60C;background:transparent}
.autolab-check-area{cursor:pointer;display:flex;align-items:flex-start;gap:6px;flex:1;min-width:0}
.autolab-task-text{font-size:var(--text-sm);color:var(--text-primary);line-height:1.55;flex:1;font-weight:450}
.autolab-action-btn{font-size:var(--text-xs);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-subtle);cursor:pointer;color:var(--text-secondary);flex-shrink:0}
.autolab-action-btn.del{border-color:var(--status-overdue-bg);background:var(--status-overdue-bg);color:var(--status-overdue-fg)}
.priority-badge{display:none}
.p-DO{background:var(--p-do-bg);color:var(--p-do-fg)}
.p-DELEGATE{background:var(--p-delegate-bg);color:var(--p-delegate-fg)}
.p-SCHEDULE{background:var(--p-schedule-bg);color:var(--p-schedule-fg)}
.p-ELIMINATE{background:var(--p-eliminate-bg);color:var(--p-eliminate-fg)}
.p-none{background:var(--p-eliminate-bg);color:var(--text-tertiary)}
.due-badge{font-size:var(--text-xs);font-weight:500;white-space:nowrap;background:transparent;padding:0}
.due-overdue{color:var(--status-overdue-fg);background:transparent}
.due-soon{color:var(--status-soon-fg);background:transparent}
.due-normal{color:var(--text-tertiary);background:transparent}
.overdue-badge{font-size:var(--text-xs);font-weight:500;color:var(--status-overdue-fg);flex-shrink:0;background:transparent;padding:0;min-width:36px;text-align:right;margin-top:2px}
.done-badge{font-size:var(--text-xs);color:#1B8E4D;font-weight:500;background:transparent;padding:0}
.checkbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all 0.15s}
.checkbox.checked{background:var(--accent);border-color:var(--accent)}
.cohort-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:28px}
.cohort-card{background:var(--bg-surface);border-radius:var(--radius-lg);border:none;overflow:hidden;box-shadow:var(--shadow-card)}
.cohort-card-header{padding:12px 18px;font-size:var(--text-sm);font-weight:600;display:flex;align-items:center;justify-content:space-between;letter-spacing:-0.01em}
.edit-day-btn{font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-surface);cursor:pointer;font-weight:500;color:var(--text-secondary)}
.edit-day-btn:hover{background:var(--bg-subtle)}
.progress-bar-wrap{height:3px;background:var(--border-default)}
.progress-bar{height:3px;transition:width 0.3s}
.cohort-card-body{padding:16px 18px}
.cohort-matrix-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.cohort-matrix-table th,.cohort-matrix-table td{border:1px solid #E4E6EB;padding:6px 10px;text-align:center;white-space:nowrap}
.cohort-matrix-table th{background:#F5F7FA;font-weight:600;font-size:12px}
.cm-field{background:#FFF1E8}
.cm-autolab{background:#EAF3FF}
.cm-off{background:#F5F7FA}
.cm-date-cell{font-size:12px;font-weight:500;text-align:left;min-width:90px}
.assignee-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.assignee-row:last-child{margin-bottom:0}
.a-chip{font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;min-width:44px;text-align:right;background:transparent!important;padding:0;border-radius:0;margin-top:2px;line-height:1.4}
.task-list{flex:1}
.task-item{display:flex;align-items:flex-start;gap:7px;padding:4px 0;cursor:pointer;border-radius:8px}
.task-item:hover{background:var(--bg-canvas)}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-tertiary)}
.task-item.overdue-item{background:transparent;border-left:none;padding-left:0}
.task-item.overdue-item.done{background:transparent}
.task-text{font-size:var(--text-sm);color:var(--text-primary);line-height:1.5;flex:1}
.progress-text{font-size:var(--text-xs);font-weight:500;color:var(--text-secondary)}
.overdue-section-label{font-size:var(--text-xs);color:var(--status-overdue-fg);font-weight:600;padding:4px 0 2px;border-bottom:1px solid var(--status-overdue-bg);margin-bottom:4px}
.matrix-wrap{margin-bottom:16px}
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.matrix-cell{background:var(--bg-surface);border-radius:var(--radius-lg);border:none;overflow:hidden;min-height:120px;transition:box-shadow 0.2s;box-shadow:var(--shadow-card)}
.matrix-cell.drag-over{box-shadow:0 0 0 2px var(--accent),0 4px 16px rgba(254,91,27,0.16);background:var(--accent-subtle)}
.matrix-cell-header{padding:8px 14px;font-size:var(--text-xs);font-weight:600;display:flex;align-items:center;justify-content:space-between;letter-spacing:0.02em;text-transform:uppercase}
.matrix-cell-body{padding:14px 16px;min-height:80px}
.m-DO .matrix-cell-header{background:var(--p-do-bg);color:var(--p-do-fg)}
.m-SCHEDULE .matrix-cell-header{background:var(--p-schedule-bg);color:var(--p-schedule-fg)}
.m-DELEGATE .matrix-cell-header{background:var(--p-delegate-bg);color:var(--p-delegate-fg)}
.m-ELIMINATE .matrix-cell-header{background:var(--p-eliminate-bg);color:var(--p-eliminate-fg)}
.matrix-item{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;border-radius:var(--radius-sm);margin-bottom:4px;background:var(--bg-canvas);border:1px solid var(--border-subtle);cursor:pointer}
.matrix-item:hover{background:var(--bg-subtle)}
.matrix-item.done .matrix-task-text{text-decoration:line-through;color:var(--text-tertiary)}
.matrix-task-text{font-size:var(--text-sm);color:var(--text-primary);flex:1;line-height:1.5}
.matrix-overdue{border-left:3px solid #FC5555}
.matrix-empty{font-size:var(--text-xs);color:var(--text-tertiary);text-align:center;padding:20px 0}
.matrix-add-btn{font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-sm);border:1px solid currentColor;background:transparent;cursor:pointer;opacity:0.7}
.matrix-add-btn:hover{opacity:1}
.matrix-add-form{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.matrix-add-form input{font-size:var(--text-xs);padding:6px 8px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--bg-surface);font-family:var(--font-sans);color:var(--text-primary)}
.matrix-add-form-btns{display:flex;flex-direction:column;gap:4px}
.matrix-add-form-btns button:not(.matrix-confirm-btn){font-size:var(--text-xs);color:var(--text-tertiary);background:none;border:none;cursor:pointer;padding:4px;text-align:center}
.matrix-confirm-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:var(--text-sm);padding:8px;width:100%;cursor:pointer;font-family:var(--font-sans)}
.matrix-confirm-btn:disabled{background:var(--accent-subtle);color:var(--accent);cursor:not-allowed}
.unclassified-section{background:var(--bg-surface);border-radius:var(--radius-lg);border:none;padding:20px;margin-top:8px;box-shadow:var(--shadow-card)}
.unclassified-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:4px;border:1px solid var(--border-subtle);background:var(--bg-canvas);cursor:grab;user-select:none;transition:opacity 0.2s}
.unclassified-item:active{cursor:grabbing}
.unclassified-item.dragging{opacity:0.4}
.drag-hint{font-size:var(--text-xs);color:var(--text-tertiary);margin-bottom:8px}
.history-wrap{background:var(--bg-surface);border-radius:var(--radius-lg);border:none;overflow:hidden;box-shadow:var(--shadow-card)}
.history-toolbar{padding:12px 20px;background:var(--bg-subtle);color:var(--text-primary);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border-default)}
.history-toolbar select{font-size:var(--text-xs);padding:4px 8px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-surface);color:var(--text-primary);cursor:pointer}
.history-toolbar select option{color:var(--text-primary);background:var(--bg-surface)}
.history-body{padding:16px 20px}
.history-date-group{margin-bottom:16px}
.history-date-label{font-size:var(--text-xs);font-weight:600;color:var(--text-secondary);padding:4px 0;border-bottom:1px solid var(--border-default);margin-bottom:8px;letter-spacing:0.02em;text-transform:uppercase}
.history-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:4px;border:1px solid var(--border-subtle);background:var(--bg-canvas)}
.history-item.done{background:var(--status-done-bg);border-color:var(--status-done-border)}
.history-item.done .history-task-text{text-decoration:line-through;color:var(--text-tertiary)}
.history-task-text{font-size:var(--text-sm);color:var(--text-primary);flex:1;line-height:1.5}
.history-done-toggle{font-size:var(--text-xs);font-weight:500;color:var(--text-secondary);cursor:pointer;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-canvas);margin-bottom:8px;display:flex;align-items:center;gap:6px;width:fit-content}
.history-done-toggle:hover{background:var(--bg-subtle)}
.loading{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.spinner{width:32px;height:32px;border:3px solid var(--border-default);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:var(--text-xs);opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;font-family:var(--font-sans)}
.toast.show{opacity:1}
.empty-day{background:var(--bg-surface);border-radius:var(--radius-lg);border:none;padding:48px;text-align:center;color:var(--text-tertiary);box-shadow:var(--shadow-card)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg-surface);border-radius:20px;padding:28px;width:100%;max-width:500px;box-shadow:0 16px 48px rgba(0,0,0,0.16),0 0 0 1px var(--border-subtle)}
.modal-title{font-size:var(--text-base);font-weight:600;margin-bottom:4px;letter-spacing:-0.01em;color:var(--text-primary)}
.modal-sub{font-size:var(--text-xs);color:var(--text-tertiary);margin-bottom:14px}
.modal textarea{width:100%;font-size:var(--text-sm);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.6;resize:vertical;min-height:120px;font-family:var(--font-sans);color:var(--text-primary)}
.modal textarea:focus{outline:none;border-color:var(--accent)}
.modal-guide{font-size:var(--text-xs);color:var(--text-tertiary);margin-top:8px;line-height:1.6}
.modal-guide b{color:var(--text-secondary)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-btns button{font-size:var(--text-sm);padding:7px 18px;border-radius:var(--radius-sm);border:1px solid var(--border-default);cursor:pointer;font-family:var(--font-sans)}
.btn-cancel{background:var(--bg-subtle);color:var(--text-secondary)}.btn-cancel:hover{background:var(--bg-canvas)}
.btn-save{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-save:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:var(--bg-surface);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-sans);font-size:var(--text-xs);font-weight:600}
.btn-ghost:hover{background:var(--bg-subtle);border-color:var(--border-strong);color:var(--text-primary)}
/* Priority-based left borders via :has() */
.autolab-item:has(.p-DO){border-left:3px solid #FC5555}
.autolab-item:has(.p-SCHEDULE){border-left:3px solid var(--accent)}
.autolab-item:has(.p-DELEGATE){border-left:3px solid #F2A60C}
.autolab-item:has(.p-DO):hover,.autolab-item:has(.p-SCHEDULE):hover,.autolab-item:has(.p-DELEGATE):hover{background:var(--bg-subtle)}
@media (max-width: 640px) {
  .main{padding:12px}
  .header{padding:10px 14px}
  .date-label{min-width:120px;font-size:13px}
  .tab-bar{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;border-radius:12px}
  .tab-btn{white-space:nowrap;padding:8px 14px}
  .person-autolab-grid{grid-template-columns:1fr;gap:10px}
  .matrix-grid{grid-template-columns:1fr}
  .cohort-grid{grid-template-columns:1fr}
  .modal-bg{padding:16px 10px}
  .modal{padding:20px 16px}
}

/* ============================================================
   Caramel-native rebuild — presentation layer
   (component language: app bar, segmented tabs, team-board
    cards, pill tags, bottom sheets, 2×2 matrix)
   ============================================================ */
::selection{background:var(--brand-tint)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:999px;border:3px solid var(--bg-canvas)}
*::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
.main{max-width:1320px;padding:28px 28px 64px}

/* ---- App bar ---- */
.header{padding:0 28px;min-height:66px;gap:16px;box-shadow:0 1px 0 var(--border-subtle)}
.brand-lockup{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:-0.05em;flex:none}
.brand-text{display:flex;flex-direction:column;gap:1px;line-height:1.1;min-width:0}
.brand-wordmark{font-weight:800;font-size:16px;letter-spacing:-0.03em;color:var(--text-primary)}
.brand-sub{font-size:11px;font-weight:600;color:var(--text-tertiary);letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{gap:10px}
/* date stepper as segmented control */
.date-nav{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:3px;gap:0}
.date-nav button{background:transparent;border:none;border-radius:6px;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:13px}
.date-nav button:hover{background:var(--bg-subtle);color:var(--brand)}
.date-label{min-width:178px;font-size:13px;font-weight:700;color:var(--text-primary)}
/* ghost pill controls */
.icon-btn,.toggle-done-btn{background:var(--bg-surface);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.icon-btn:hover,.toggle-done-btn:hover{background:var(--bg-subtle);border-color:var(--border-strong);color:var(--text-primary)}
.toggle-done-btn.active{background:var(--brand-tint);color:var(--brand);border-color:transparent;box-shadow:none}

/* ---- Segmented tab control ---- */
.tab-bar{gap:3px;margin-bottom:28px;background:var(--bg-muted);padding:4px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-subtle);width:fit-content;max-width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-secondary);white-space:nowrap;flex:none;transition:background .15s,color .15s}
.tab-btn:hover{background:rgba(255,255,255,0.6);color:var(--text-primary)}
.tab-btn.active{background:var(--brand);color:#fff}

/* ---- Pill tag system (Caramel Tag) ---- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1;letter-spacing:-0.02em;padding:4px 7px;border-radius:5px;white-space:nowrap}
.tag-neutral{background:var(--bg-muted);color:var(--text-secondary)}
.tag-brand{background:var(--brand-tint);color:var(--brand)}
.tag-danger{background:var(--status-overdue-bg);color:var(--status-overdue-fg)}
.tag-success{background:var(--status-done-bg);color:var(--status-done-fg)}
.tag-amber{background:var(--status-soon-bg);color:var(--status-soon-fg)}

/* ---- Cards: hover lift ---- */
.person-autolab-card,.cohort-card{position:relative;transition:box-shadow .2s ease}
.person-autolab-card:hover,.cohort-card:hover{box-shadow:0 0 0 1px var(--border-default),0 4px 14px rgba(0,0,0,0.05)}

/* ---- Person team-board card ---- */
.person-accent{height:3px;width:100%;opacity:0.9}
.person-autolab-header{background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);padding:14px 16px 12px}
.person-id{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.person-dot{width:7px;height:7px;border-radius:50%;flex:none}
.person-autolab-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-meta{display:flex;align-items:center;gap:8px;flex:none}
.person-count{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-tertiary);letter-spacing:-0.02em}
.person-count b{color:var(--text-primary);font-weight:700}
.person-count-sep{color:var(--border-strong);margin:0 1px}
.person-progress{height:4px;background:var(--bg-muted)}
.person-progress-bar{height:100%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.autolab-item{padding:11px 12px;border-radius:var(--radius-md);transition:background .12s}
.autolab-task-text{font-weight:500}
.autolab-action-btn{opacity:0;border-radius:6px;width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;transition:opacity .15s,background .15s}
.autolab-item:hover .autolab-action-btn{opacity:1}
.autolab-action-btn.del{border-color:transparent;background:var(--bg-muted);color:var(--text-tertiary)}
.autolab-action-btn.del:hover{background:var(--status-overdue-bg);color:var(--status-overdue-fg)}

/* ---- Badges → pills ---- */
.due-badge{padding:0;background:transparent;font-weight:600;font-size:12px;line-height:18px}
.due-badge.due-overdue{color:var(--status-overdue-fg);font-weight:700}
.due-badge.due-soon{color:var(--status-soon-fg);font-weight:700}
.due-badge.due-normal{color:var(--text-tertiary)}
.overdue-badge{background:transparent;color:var(--status-overdue-fg);padding:0;font-weight:700;font-size:12px;line-height:18px;min-width:0;text-align:left;margin-top:0}
.done-badge{background:transparent;color:var(--status-done-fg);padding:0;font-weight:700;font-size:12px;line-height:18px}

/* ---- Checkbox ---- */
.checkbox{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--border-strong);transition:all .15s}
.autolab-check-area:hover .checkbox,.task-item:hover .checkbox{border-color:var(--brand)}
.checkbox.checked{background:var(--brand);border-color:var(--brand)}

/* ---- Cohort card ---- */
.cohort-card-header{padding:14px 18px;background:var(--bg-surface);color:var(--text-primary)}
.cohort-num{font-size:22px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.cohort-num-suffix{font-size:13px;font-weight:700;margin-left:1px;opacity:0.7}
.progress-bar-wrap{height:4px;background:var(--bg-muted)}
.progress-bar{height:100%}
.a-chip{background:transparent!important;padding:0!important;border-radius:0!important;min-width:44px;text-align:right;font-size:12px;font-weight:700;margin-top:0;line-height:1.5}
.task-item{padding:6px 8px;border-radius:var(--radius-sm)}
.task-text{font-weight:500}
.overdue-section-label{border:none;color:var(--status-overdue-fg);font-weight:700;letter-spacing:0.02em;text-transform:uppercase;font-size:11px;padding:2px 0 6px}

/* ---- Eisenhower matrix ---- */
.matrix-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.matrix-title{font-size:18px;font-weight:800;letter-spacing:-0.03em;color:var(--text-primary)}
.matrix-axis-note{font-size:12px;font-weight:600;color:var(--text-tertiary);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:6px 12px}
.matrix-cell{border-radius:var(--radius-lg)}
.matrix-cell-header{padding:11px 16px;text-transform:none;letter-spacing:-0.01em;font-size:13px;font-weight:700}
.matrix-item{border-radius:var(--radius-md);border-color:var(--border-subtle);background:var(--bg-surface);padding:9px 11px;transition:background .12s,box-shadow .12s}
.matrix-item:hover{background:var(--bg-surface);box-shadow:var(--shadow-1)}
.matrix-task-text{font-weight:500}
.matrix-confirm-btn{border-radius:var(--radius-md);font-weight:700}
.unclassified-item{border-radius:var(--radius-md);border-color:var(--border-subtle)}
.unclassified-item:hover{border-color:var(--border-default);background:var(--bg-subtle)}

/* ---- History ---- */
.history-wrap{border-radius:var(--radius-lg)}
.history-toolbar{padding:16px 20px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle)}
.history-toolbar select{border-radius:8px;padding:7px 12px;font-weight:600;background:var(--bg-subtle);border-color:transparent}
.history-toolbar select:hover{background:var(--bg-muted)}
.history-date-label{border:none;color:var(--text-tertiary);font-weight:700;letter-spacing:0.02em}
.history-item{border-radius:var(--radius-md);border-color:var(--border-subtle);padding:12px 14px}
.history-item.done{background:var(--status-done-bg);border-color:var(--status-done-border)}
.history-done-toggle{border-radius:8px;font-weight:600;background:var(--bg-subtle);border-color:transparent}

/* ---- Cohort schedule table ---- */
.cohort-matrix-table th{background:var(--bg-subtle);color:var(--text-secondary);text-transform:none;border-color:var(--border-subtle)}
.cohort-matrix-table td{border-color:var(--border-subtle)}

/* ---- Modals → right slide-in drawer (keeps the list in view) ---- */
.modal-bg{align-items:stretch;justify-content:flex-end;padding:0;background:var(--bg-scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal-bg.open{align-items:stretch}
.modal{width:100%;max-width:460px;height:100%;max-height:100%;margin:0;border-radius:0;padding:24px 28px 30px;box-shadow:-10px 0 40px rgba(0,0,0,0.14);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.85,.25,1);position:relative;overflow-y:auto}
.modal-bg.open .modal{transform:translateX(0)}
.dm-close{flex:none;width:30px;height:30px;border:none;background:transparent;border-radius:8px;color:var(--text-tertiary);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.dm-close:hover{background:var(--bg-subtle);color:var(--text-primary)}
.modal-title{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.modal textarea,.modal input[type=text],.modal select,.modal input[type=date]{border-radius:var(--radius-md)}
.modal textarea:focus,.modal input[type=text]:focus{border-color:var(--border-brand);border-width:1.5px}
.modal-btns button{border-radius:var(--radius-md);font-weight:700;padding:11px 20px}
.btn-save{box-shadow:none}
@media (min-width:560px){
  .modal{border-radius:0}
}

/* ---- Empty / loading ---- */
.empty-day{border-radius:var(--radius-lg);padding:64px 24px;font-size:15px;font-weight:600}
.spinner{border-top-color:var(--brand)}

@media (max-width:640px){
  .date-label{min-width:120px}
}

/* ============================================================
   Operations console — from-scratch layout
   sidebar nav · sticky context bar · hairline panels ·
   near-monochrome with a single orange accent
   ============================================================ */
body{background:var(--bg-canvas)}
.app{display:flex;align-items:stretch;min-height:100vh}
.sidebar{width:180px;flex:none;background:var(--bg-surface);border-right:1px solid var(--border-1);
  display:flex;flex-direction:column;gap:22px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand-lockup{padding:2px 8px;flex-direction:column;align-items:flex-start;gap:7px}
.brand-logo{height:40px;width:auto;display:block;filter:none;max-width:140px}
.nav{display:flex;flex-direction:column;gap:22px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--text-tertiary);text-transform:uppercase;padding:0 10px 8px}
/* nav rows — switchTab() forces class back to .tab-btn[.active], so we style those */
.tab-btn{position:relative;display:flex;align-items:center;width:100%;justify-content:flex-start;text-align:left;
  padding:9px 10px;border-radius:7px;background:transparent;border:none;cursor:pointer;font-family:var(--font-sans);
  font-size:13.5px;font-weight:600;letter-spacing:-0.01em;color:var(--text-secondary);transition:color .12s}
.tab-btn:hover{background:var(--bg-subtle);color:var(--text-primary);box-shadow:none}
.tab-btn.active{background:var(--brand-tint);color:var(--brand);box-shadow:none}
.tab-btn.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:60px;padding:11px 32px;background:rgba(255,255,255,0.82);
  backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--border-1)}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
.topbar-right{display:flex;align-items:center;gap:8px}
.views{padding:32px;max-width:1240px;width:100%}

/* view + section headers */
.view-head{margin-bottom:22px}
.view-title{font-size:21px;font-weight:800;letter-spacing:-0.035em;color:var(--text-primary)}
.view-sub{font-size:13px;color:var(--text-tertiary);margin-top:4px;letter-spacing:-0.01em}
.section-label{font-size:12px;font-weight:700;letter-spacing:0.02em;color:var(--text-secondary);margin:0 0 14px}

/* dashboard: 3 person columns as one hairline-unified panel */
.person-autolab-grid{grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-1);
  border:1px solid var(--border-1);border-radius:10px;overflow:hidden;margin-bottom:36px}
.person-autolab-card{background:var(--bg-surface);border-radius:0;box-shadow:none}
.person-autolab-card:hover{box-shadow:none}
.person-accent{display:none}
.person-autolab-header{background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);padding:15px 16px 13px;min-height:48px}
.person-autolab-name{font-size:14px;font-weight:700;letter-spacing:-0.01em}
.person-progress{height:2px;background:var(--bg-muted)}
.person-count{font-size:12px}

/* cohort: flat hairline cards */
.cohort-grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:8px}
.cohort-card{border:1px solid var(--border-1);border-radius:10px;box-shadow:none}
.cohort-card:hover{box-shadow:none}
.cohort-card-header{border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
.cohort-num{font-size:20px;font-weight:800;color:var(--text-primary)}
.cohort-num-suffix{color:var(--text-tertiary);opacity:1}

/* matrix / history / empty — flat hairline panels */
.matrix-cell{border:1px solid var(--border-1);box-shadow:none;border-radius:10px}
.matrix-grid{gap:16px}
.matrix-item{box-shadow:none}
.matrix-item:hover{box-shadow:none;background:var(--bg-subtle)}
.unclassified-section{border:1px solid var(--border-1);box-shadow:none}
.history-wrap{border:1px solid var(--border-1);box-shadow:none}
.empty-day{border:1px solid var(--border-1);box-shadow:none}
.matrix-title{font-size:20px;font-weight:800;letter-spacing:-0.03em}

@media (max-width:1180px){
  .person-autolab-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border-1);
    gap:14px;padding:16px 18px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:10px 18px}
  .nav-group{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px}
  .nav-label{display:none}
  .tab-btn{width:auto;padding:7px 12px}
  .tab-btn.active::before{display:none}
  .topbar{padding:11px 18px}
  .views{padding:22px 18px 48px}
  .person-autolab-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .person-autolab-grid{grid-template-columns:1fr}
}

/* declutter — remove the left-accent color stripes (overdue/priority cliché),
   keep overdue signalled by the red "지남" text; align assignee/task rows */
.autolab-item,
.autolab-item.overdue,
.autolab-item.overdue.done,
.autolab-item.due-soon{border-left:0;padding-left:12px;background:transparent}
.autolab-item:has(.p-DO),
.autolab-item:has(.p-SCHEDULE),
.autolab-item:has(.p-DELEGATE){border-left:0}
.autolab-item:hover{background:var(--bg-subtle)}
.matrix-overdue{border-left:0}
.task-item.overdue-item{border-left:0;padding-left:0}
.assignee-row{align-items:flex-start}
.a-chip{padding:6px 0 0 0!important;line-height:1.5;font-size:14px;color:var(--text-secondary)}

/* priority tag — hue = importance, short label for an instant read */
.ptag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;line-height:18px;letter-spacing:-0.02em;padding:0 7px;border-radius:5px}
.ptag-DO{background:#FFE7E5;color:#C8392E}
.ptag-DELEGATE{background:#FBEFD7;color:#92651A}
.ptag-SCHEDULE{background:#E4F1FC;color:#0A6FB5}
.ptag-ELIMINATE{background:#EEF0F2;color:#6D727A}

/* ---------- 아침판 (봇 DM을 한 화면으로, 항목마다 바로 처리) — taste-skill editorial-greeting · 카라멜 토큰 ---------- */
#morning-content{max-width:1480px;padding:28px 32px 48px;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.mp-head h1{font-size:28px;font-weight:600;line-height:1.25;letter-spacing:-0.01em;color:var(--text-primary)}
.mp-head p{margin-top:8px;font-size:var(--text-base);color:var(--text-secondary)}
.mp-head p b{color:var(--text-primary);font-weight:600}
.mp-views{display:flex;gap:4px;margin-top:20px;padding:4px;background:var(--bg-muted);border-radius:999px;width:max-content;max-width:100%}
.mp-view{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-sans);font-size:var(--text-sm);color:var(--text-secondary)}
.mp-view.on{background:var(--bg-surface);color:var(--text-primary);font-weight:600}
.mp-view span{font-size:var(--text-xs);color:var(--text-secondary);margin-left:2px}
.mp-strip{margin-top:20px}
.mp-read{margin-top:20px}
.mp-strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;font-size:var(--text-xs);color:var(--text-secondary)}
.mp-strip-head b{font-size:var(--text-sm);color:var(--text-primary);font-weight:600}
.mp-legend{display:flex;gap:14px}
.mp-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.mp-cells{display:flex;gap:3px}
.mp-cell{flex:1 1 0;min-width:0;height:26px;border:0;border-radius:4px;background:var(--border-subtle);cursor:pointer;padding:0}
.mp-cell.first:not(:first-child){margin-left:9px}
.mp-cell.new{background:var(--accent-subtle)}
.mp-cell.done{background:var(--accent)}
.mp-cell.sel{outline:2px solid var(--text-primary);outline-offset:-2px}
.mp-groups{margin-top:8px;font-size:var(--text-xs);color:var(--text-secondary)}
.mp-work{margin-top:24px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start}
.mp-list,.mp-detail{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);min-width:0}
.mp-list{padding:6px;position:sticky;top:12px;max-height:calc(100vh - 120px);overflow-y:auto}
.mp-tabs{display:flex;gap:18px;padding:8px 10px 0;border-bottom:1px solid var(--border-subtle);margin-bottom:4px}
.mp-tab{background:none;border:0;padding:6px 0 9px;color:var(--text-secondary);cursor:pointer;position:relative;font-family:var(--font-sans);font-size:var(--text-sm)}
.mp-tab.on{color:var(--text-primary)}
.mp-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text-primary)}
.mp-grp{font-size:var(--text-xs);color:var(--text-secondary);padding:12px 10px 4px}
.mp-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;font-family:var(--font-sans);color:var(--text-primary)}
.mp-row:hover{outline:1px solid var(--border-default);outline-offset:-1px}
.mp-row.cur{background:var(--bg-muted)}
.mp-row .dot{width:6px;height:6px;border-radius:50%;background:var(--text-primary);align-self:center}
.mp-row.decided .dot{background:transparent}
.mp-row .who{font-weight:600;font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row.decided .who{font-weight:400}
.mp-row .when{font-size:var(--text-xs);color:var(--text-secondary);white-space:nowrap}
.mp-row .l2{grid-column:2/4;font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row .l2 b{color:var(--text-primary);font-weight:500}
.mp-detail{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px 24px}
.mp-detail h2{font-size:20px;font-weight:600;line-height:1.35}
.mp-detail .src{margin-top:4px;color:var(--text-secondary)}
.mp-detail blockquote{margin:16px 0 0;padding-left:12px;border-left:2px solid var(--border-strong);font-size:var(--text-base);line-height:1.6}
.mp-detail .body{margin-top:12px;font-size:15px;line-height:1.6}
.mp-detail .orig{display:inline-block;margin-top:12px;color:var(--text-primary)}
.mp-verdict{margin-top:18px;padding:14px;background:var(--bg-canvas);border-radius:var(--radius-md)}
.mp-verdict p{color:var(--text-secondary)}
.mp-verdict p b{color:var(--text-primary)}
.mp-acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.mp-btn{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg-surface);cursor:pointer;font-family:var(--font-sans);font-size:var(--text-sm);color:var(--text-primary);white-space:nowrap}
.mp-btn:hover{border-color:var(--text-primary)}
.mp-btn.pri{background:var(--text-primary);border-color:var(--text-primary);color:#fff}
.mp-btn:disabled{opacity:.5;cursor:wait}
.mp-target{margin-top:10px;padding:12px 14px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md)}
.mp-target-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mp-target-head b{font-size:var(--text-sm);line-height:1.4}
.mp-target-meta{margin-top:2px;font-size:var(--text-xs);color:var(--text-secondary)}
.mp-target ul{margin:8px 0 0;padding-left:16px;font-size:13px;color:var(--text-primary);display:grid;gap:2px}
.mp-target-last{margin-top:6px;font-size:13px;color:var(--text-secondary)}
/* ---------- 큰 주제 표시 (목록·매트릭스·상세 창) ---------- */
.parent-tag{margin-top:3px;font-size:11.5px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.parent-tag:hover{color:var(--text-primary);text-decoration:underline;text-underline-offset:3px}
.family{margin-top:10px;display:grid;gap:8px;padding:10px 12px;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-sm)}
.family-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:start;font-size:12px}
.family-row>span{color:var(--text-secondary);padding-top:2px}
.family-kids{display:grid;gap:2px}
.family-link{background:none;border:0;padding:2px 0;text-align:left;font-family:var(--font-sans);font-size:12.5px;color:var(--text-primary);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.family-link:hover{text-decoration:underline;text-underline-offset:3px}
.family-link.done{color:var(--text-tertiary);text-decoration:line-through}
/* ---------- 일정 (큰 주제 → 하위, 시작일부터 마감일까지 막대) ---------- */
#plan-content{padding:28px 32px 48px;word-break:keep-all;font-variant-numeric:tabular-nums}
.pl-head h1{font-size:28px;font-weight:600;letter-spacing:-0.01em}
.pl-head p{margin-top:6px;font-size:var(--text-base);color:var(--text-secondary)}
.pl-head p b{color:var(--text-primary)}
.pl-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:var(--text-xs);color:var(--text-secondary)}
.pl-legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.pl-scroll{margin-top:18px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow-x:auto}
.pl-grid{min-width:980px;position:relative}
.pl-row{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:36px;border-top:1px solid var(--border-subtle)}
.pl-row.top,.pl-row.solo{border-top:1px solid var(--border-default)}
.pl-scale{position:sticky;top:0;z-index:2;background:var(--bg-surface);border-top:0;min-height:40px}
.pl-scale .pl-name{font-size:var(--text-xs);color:var(--text-secondary);align-self:end;padding-bottom:8px}
.pl-name{display:flex;align-items:center;gap:6px;padding:0 12px;min-width:0;font-size:13px;color:var(--text-primary);border-right:1px solid var(--border-subtle);cursor:grab;user-select:none}
.pl-name .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-name .t:hover{text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.pl-name .id{color:var(--text-tertiary);font-size:var(--text-xs);flex:none}
.pl-name .n{flex:none;font-size:var(--text-xs);color:var(--text-secondary)}
.pl-row.top .pl-name{font-weight:600}
.pl-row.child .pl-name{padding-left:30px;color:var(--text-secondary)}
.pl-row.child .pl-name .t{color:var(--text-primary)}
.pl-name .pr{width:3px;align-self:stretch;margin:8px 0;border-radius:2px;flex:none;background:transparent}
.pr-DO{background:#C8392E!important}.pr-SCHEDULE{background:#0A6FB5!important}.pr-DELEGATE{background:#C27C0E!important}.pr-ELIMINATE{background:#A6ABB3!important}
.pl-row.drop-over .pl-name{background:var(--accent-subtle);outline:2px dashed var(--accent);outline-offset:-3px}
.pl-row.dragging{opacity:.4}
.pl-track{position:relative;min-width:0}
.pl-bar{position:absolute;top:50%;height:16px;margin-top:-8px;border-radius:4px;background:var(--border-strong)}
.pl-row.top .pl-bar{background:var(--text-secondary)}
/* 마감 없음 = 시작점 + 가는 점선(막대가 화면을 덮지 않게) */
.pl-bar.open{height:3px;margin-top:-1.5px;border-radius:0;background:repeating-linear-gradient(90deg,var(--border-strong) 0 4px,transparent 4px 8px)}
.pl-row.top .pl-bar.open{background:repeating-linear-gradient(90deg,var(--text-secondary) 0 4px,transparent 4px 8px)}
.pl-start{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--border-strong)}
.pl-row.top .pl-start{background:var(--text-secondary)}
.pl-bar.over{background:#C8392E}
.pl-lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:var(--text-xs);color:var(--text-secondary);white-space:nowrap;padding-left:6px}
.pl-lbl.over{color:#C8392E;font-weight:600}
.pl-layer{position:absolute;top:0;bottom:0;left:320px;right:0;pointer-events:none}
.pl-wkend{position:absolute;top:0;bottom:0;background:rgba(47,50,56,0.035)}
.pl-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent)}
.pl-tick{position:absolute;bottom:8px;font-size:var(--text-xs);color:var(--text-secondary);white-space:nowrap}
.pl-tick.today{color:var(--accent);font-weight:600}
.pl-root{margin:0;padding:12px;text-align:center;font-size:var(--text-xs);color:var(--text-secondary);border-top:1px dashed var(--border-default)}
.pl-root.drop-over{background:var(--accent-subtle);color:var(--text-primary)}
/* 상세 창 그 자리에서 고치기 */
.dmp-title{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid transparent;padding:2px 0;font-family:var(--font-sans);font-size:17px;font-weight:600;color:var(--text-primary);background:transparent;outline:none}
.dmp-title:hover{border-bottom-color:var(--border-default)}.dmp-title:focus{border-bottom-color:var(--accent)}
.dmp{display:grid;gap:2px;margin:6px 0 4px}
.dmp-row{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:8px;min-height:34px;font-size:13px}
.dmp-row>span{color:var(--text-secondary);font-size:12px}
.dmp-row select,.dmp-dates input{font-family:var(--font-sans);font-size:12.5px;padding:5px 8px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text-primary);max-width:100%}
.dmp-dates{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dmp-x{background:none;border:0;color:var(--text-tertiary);font-size:12px;cursor:pointer;text-decoration:underline}
.dmp-done{display:flex;align-items:center;gap:6px;cursor:pointer}
.dmp-chips{display:flex;flex-wrap:wrap;gap:4px}
.dmp-chip{padding:3px 9px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);font-family:var(--font-sans);font-size:12px;color:var(--text-secondary);cursor:pointer}
.dmp-chip.on{color:#fff;border-color:transparent}
.dmp-chip.on.p-none{background:var(--text-secondary)}.dmp-chip.on.p-DO{background:#C8392E}.dmp-chip.on.p-SCHEDULE{background:#0A6FB5}.dmp-chip.on.p-DELEGATE{background:#C27C0E}.dmp-chip.on.p-ELIMINATE{background:#8A8F96}
.dmp-up{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.dmp-sub{margin:10px 0;padding:10px 12px;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-sm)}
.dmp-sub-h{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.dmp-kid{display:flex;align-items:center;gap:6px;min-height:26px}
.dmp-kid .family-link{flex:1;min-width:0}
.dmp-kid.done .family-link{color:var(--text-tertiary);text-decoration:line-through}
.dmp-kdue{font-size:11.5px;color:var(--text-secondary);flex:none}
.dmp-input{width:100%;box-sizing:border-box;margin-top:6px;font-family:var(--font-sans);font-size:12.5px;padding:7px 10px;border:1px dashed var(--border-default);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text-primary)}
.dmp-input:focus{border-style:solid;border-color:var(--accent);outline:none}
.dmp-desc{cursor:text;border-radius:var(--radius-sm);padding:6px 8px;margin-left:-8px;margin-right:-8px}
.dmp-desc:hover{background:var(--bg-subtle)}
.dmp-desc-ta{width:100%;box-sizing:border-box;font-family:var(--font-sans);font-size:13px;line-height:1.6;padding:10px 12px;border:1px solid var(--accent);border-radius:var(--radius-sm);resize:vertical;color:var(--text-primary)}
.dmp-desc-acts{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
/* 날짜 고르기 창 */
.due-pop{position:fixed;z-index:300;width:220px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-sheet);padding:6px;display:grid;gap:1px}
.due-pop-h{font-size:11.5px;color:var(--text-tertiary);padding:4px 8px}
.due-pop button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:6px;padding:7px 8px;font-family:var(--font-sans);font-size:13px;color:var(--text-primary);cursor:pointer;text-align:left}
.due-pop button:hover,.due-pop button:focus-visible{background:var(--bg-muted);outline:none}
.due-pop button small{color:var(--text-secondary);font-size:12px}
.due-pop-cal{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 8px;font-size:12.5px;color:var(--text-secondary);border-top:1px solid var(--border-subtle);margin-top:4px}
.due-pop-cal input{font-family:var(--font-sans);font-size:12px;padding:3px 5px;border:1px solid var(--border-default);border-radius:4px}
.due-pop-clear{color:var(--text-secondary)!important}
.pl-lbl-btn{background:none;border:0;padding:0 0 0 6px;font-family:var(--font-sans);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.pl-lbl.live{color:var(--accent);font-weight:600}
.pl-chip-due{flex:none;background:none;border:0;border-left:1px solid var(--border-subtle);padding:0 0 0 8px;font-family:var(--font-sans);font-size:12px;color:var(--accent);cursor:pointer}
.pl-guide{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.6}
.pl-guide::after{content:attr(data-label);position:absolute;top:4px;left:6px;white-space:nowrap;font-size:12px;font-weight:600;color:#fff;background:var(--accent);padding:2px 6px;border-radius:4px}
.dmp-pick{background:none;border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:4px 8px;font-family:var(--font-sans);font-size:12px;color:var(--text-primary);cursor:pointer}
/* 기다림 */
.wait-tag{margin-top:3px;font-size:11.5px;color:#8A6D00}
.wait-tag.due{color:#C8392E;font-weight:600}
.area-pill{flex:none;display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;line-height:1.5;white-space:nowrap}
.area-pill.k{background:var(--accent-subtle);color:var(--accent)}
.area-pill.base{background:var(--bg-muted,#F1F1EF);color:var(--text-secondary)}
.area-pill.out{background:transparent;color:var(--text-tertiary);box-shadow:inset 0 0 0 1px var(--border-subtle)}
.pl-areas{font-size:var(--text-xs);color:var(--text-secondary);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pl-muted,.dmp-muted{color:var(--text-tertiary);font-size:12px}
.topic-meta{margin-bottom:12px}
.dmp-next{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.wait-pill{flex:none;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:#FBEFD7;color:#7A5A12}
.dmp-wait{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary)}
.dmp-wait input{flex:1;min-width:140px;font-family:var(--font-sans);font-size:12.5px;padding:5px 8px;border:1px solid var(--border-default);border-radius:var(--radius-sm);color:var(--text-primary)}
.mp-wait{margin-top:20px;padding:14px 16px;background:#FFF8E8;border:1px solid #F3DFAE;border-radius:var(--radius-lg)}
.mp-wait-h{font-size:var(--text-sm);font-weight:600;color:#7A5A12;margin-bottom:8px}
.mp-wait-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #F3DFAE}
.mp-wait-row:first-of-type{border-top:0}
.mp-wait-t{flex:1;min-width:200px;text-align:left;color:var(--text-primary);text-decoration:none;font-weight:500}
.mp-wait-who{font-size:12.5px;color:#7A5A12}
.mp-wait .mp-btn{height:30px;padding:0 12px;font-size:12.5px}
/* 좁은 창(901–1320px) 배치 — 희준님 실제 창은 외장 모니터 반쪽 약 1,720px라 평소엔 넓은 배치(11/4) */
@media (min-width:901px) and (max-width:1320px){
  #morning-content{padding:24px 24px 40px}
  .mp-work{grid-template-columns:320px minmax(0,1fr)}
  .mp-detail{grid-template-columns:minmax(0,1fr);padding:20px}
  .mp-kv{display:grid;grid-template-columns:repeat(4,auto);gap:0 16px;justify-content:start}
  .mp-kv div{border-bottom:0;padding:2px 0;gap:6px}
  #plan-content{padding:24px 24px 40px}
  .pl-row{grid-template-columns:240px minmax(0,1fr)}
  .pl-layer{left:240px}
  .pl-grid{min-width:0}
}
/* 일정 v2 — 큰 주제 지도 */
.pl-row>.pl-name{position:sticky;left:0;z-index:3;background:var(--bg-surface)}
.pl-row.drop-over>.pl-name,.pl-name.drop-over{background:var(--accent-subtle)}
.pl-help{margin-top:4px;font-size:var(--text-xs);color:var(--text-tertiary)}
.pl-over-t{color:#C8392E}
.pl-row.line{border-top:1px solid var(--border-default)}
.pl-name.topic{font-weight:600}
.pl-caret{width:18px;flex:none;background:none;border:0;padding:0;cursor:pointer;color:var(--text-secondary);font-size:12px}
.pl-caret-sp{width:18px;flex:none}
.pl-prog{flex:none;width:38px;height:4px;border-radius:2px;background:var(--border-subtle);overflow:hidden}
.pl-prog i{display:block;height:100%;background:var(--accent)}
.pl-prog.all i{background:#1B8E4D}
.pl-bar{cursor:grab;touch-action:none;background:var(--border-strong)}
.pl-bar.topic{background:var(--text-secondary)}
.pl-bar.over{background:#C8392E}
.pl-bar.dragging{cursor:grabbing;opacity:.85;outline:2px solid var(--accent);outline-offset:1px}
.pl-h{position:absolute;top:-2px;bottom:-2px;width:8px;cursor:ew-resize}
.pl-h.l{left:-3px}.pl-h.r{right:-3px}
.pl-bar:hover .pl-h{background:rgba(255,255,255,.35)}
.pl-dia{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;transform:rotate(45deg);background:var(--bg-surface);border:2px solid var(--text-primary);z-index:1;pointer-events:none}
.pl-dia.over{border-color:#C8392E}.pl-dia.done{border-color:#1B8E4D;background:#1B8E4D}
.pl-row.kid{min-height:30px}
.pl-row.kid .pl-name{padding-left:28px;font-size:12.5px;color:var(--text-primary);cursor:grab}
.pl-row.kid.done .t{color:var(--text-tertiary);text-decoration:line-through}
.pl-check{min-width:14px;flex:none;color:#1B8E4D;font-size:11px}
.pl-due{flex:none;font-size:var(--text-xs);color:var(--text-secondary)}
.pl-due.over{color:#C8392E;font-weight:600}
.pl-grid.drop-over{outline:2px dashed var(--accent);outline-offset:-2px}
.pl-name.drop-over{background:var(--accent-subtle);outline:2px dashed var(--accent);outline-offset:-3px}
.pl-lane{margin-top:14px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px 16px}
.pl-lane-h{font-size:var(--text-xs);color:var(--text-secondary);margin-bottom:10px}
.pl-chips{display:flex;flex-wrap:wrap;gap:8px}
.pl-chip{display:flex;align-items:center;gap:6px;max-width:100%;padding:6px 10px;border:1px solid var(--border-default);border-radius:8px;background:var(--bg-surface);font-size:13px;cursor:grab}
.pl-chip.topic{font-weight:600;border-color:var(--border-strong)}
.pl-chip .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;cursor:pointer}
.pl-chip .pr{align-self:stretch;margin:2px 0}
@media (max-width:900px){#plan-content{padding:20px 16px 40px}.pl-head h1{font-size:22px}.pl-row{grid-template-columns:150px minmax(0,1fr)}.pl-layer{left:150px}.pl-name{padding:0 8px}.pl-help{display:none}.pl-prog{display:none}.pl-caret{width:14px}.pl-grid{min-width:760px}}
.mp-btn kbd,.mp-keys kbd{font-family:var(--font-sans);font-size:10.5px;padding:0 5px;margin-left:4px;border:1px solid currentColor;border-radius:4px;opacity:.6}
.mp-keys{margin-top:10px;font-size:var(--text-xs);color:var(--text-tertiary)}
.mpp-bg{position:fixed;inset:0;background:var(--bg-scrim);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0;z-index:200}
.mpp-bg.open{display:flex}
.mpp{width:min(620px,100%);background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sheet);overflow:hidden}
.mpp input{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid var(--border-subtle);padding:16px 18px;font-family:var(--font-sans);font-size:var(--text-base);outline:none;color:var(--text-primary)}
.mpp-list{max-height:52vh;overflow-y:auto;padding:6px}
.mpp-item{display:grid;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-family:var(--font-sans);color:var(--text-primary)}
.mpp-item b{font-size:var(--text-sm);font-weight:600}
.mpp-item small{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpp-item.on,.mpp-item:hover{background:var(--bg-muted)}
.mpp-bot{font-size:11px;font-weight:500;color:var(--accent)}
.mpp-hint{margin:0;padding:10px 18px;font-size:var(--text-xs);color:var(--text-tertiary)}
.mp-memo{margin-top:12px;display:grid;gap:6px}
.mp-fu{display:flex;gap:6px}
.mp-fu input[type=text]{flex:1;min-width:0;font-family:var(--font-sans);font-size:var(--text-sm);padding:6px 10px;border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-primary)}
.mp-chips{display:flex;flex-wrap:wrap;gap:6px}
.mp-chip input{position:absolute;opacity:0;pointer-events:none}
.mp-chip span{display:inline-block;padding:4px 10px;border:1px solid var(--border-default);border-radius:999px;font-size:var(--text-xs);color:var(--text-secondary);cursor:pointer}
.mp-chip input:checked+span{background:var(--text-primary);border-color:var(--text-primary);color:#fff}
.mp-chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.mp-memo textarea{width:100%;box-sizing:border-box;resize:vertical;font-family:var(--font-sans);font-size:var(--text-sm);line-height:1.5;padding:8px 10px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--text-primary)}
.mp-memo label{font-size:var(--text-xs);color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.mp-memo input{font-family:var(--font-sans);font-size:var(--text-xs);padding:4px 6px;border:1px solid var(--border-default);border-radius:var(--radius-sm);color:var(--text-primary)}
.mp-memo-shown{margin-top:10px;padding:10px 12px;background:var(--bg-surface);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--text-primary)}
.mp-done{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.mp-pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:var(--text-xs);font-weight:500;background:var(--status-done-bg);color:var(--status-done-fg);white-space:nowrap}
.mp-pill.gray{background:var(--bg-muted);color:var(--text-primary)}
.mp-link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--text-secondary);font-family:var(--font-sans);font-size:var(--text-sm)}
.mp-kv div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
.mp-kv div span:first-child{color:var(--text-secondary)}
.mp-read{margin-top:32px;display:grid;grid-template-columns:7fr 5fr;gap:16px;align-items:start}
#morning-content a{color:var(--text-primary);text-underline-offset:3px;text-decoration-color:var(--border-strong)}
.mp-panel{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px;min-width:0}
.mp-panel.full{grid-column:1/-1}
.mp-panel h3{font-size:var(--text-sm);font-weight:600;margin-bottom:10px}
.mp-panel .lead{font-size:var(--text-base);font-weight:500;line-height:1.55;margin-bottom:10px}
.mp-panel ul{list-style:none;margin:0;padding:0}

// =============================================

var DAYS=['일','월','화','수','목','금','토'];

var PRIORITY_SHORT={DO:'🔴 DO',DELEGATE:'🟡 위임',SCHEDULE:'🔵 예정',ELIMINATE:'⚪ 제거','':'미분류'};
var PRIORITY_ORDER={DO:0,DELEGATE:1,SCHEDULE:2,ELIMINATE:3,'':4};
var curDate=new Date(); curDate.setHours(0,0,0,0);

];

function getPersonColor(p){
  if(p==='공통') return {bg:'#F0F1F4',text:'#6D727A'};
  if(!personColorMap[p]){personColorMap[p]=personColorPool[personColorIdx%personColorPool.length];personColorIdx++;}
  return personColorMap[p];
}
var cohortColorPool=[
  {header:'#F5F7FA',text:'#9A6A3C',bar:'#9A6A3C'},
  {header:'#F5F7FA',text:'#3E8A72',bar:'#3E8A72'},
  {header:'#F5F7FA',text:'#4E6E9E',bar:'#4E6E9E'},
  {header:'#F5F7FA',text:'#7A6AA8',bar:'#7A6AA8'},
  {header:'#F5F7FA',text:'#A65A72',bar:'#A65A72'},
];
var cohortColorMap={},cohortColorIdx=0;
function getCohortColor(c){
  if(!cohortColorMap[c]){cohortColorMap[c]=cohortColorPool[cohortColorIdx%cohortColorPool.length];cohortColorIdx++;}
  return cohortColorMap[c];
}

function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtShort(s){if(!s)return '';var p=s.split('-');return p.length>=3?parseInt(p[1])+'/'+parseInt(p[2]):s;}
function itemDateHtml(item){return '<span style="font-size:12px;line-height:18px;color:var(--text-tertiary)">'+fmtShort(item.dateKey)+'</span>';}
function dDisp(d){return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일('+DAYS[d.getDay()]+')';}
function alKey(item){return 'autolab_'+String(item.id);}
function cohortCheckKey(dateKey,cohort,taskIndex){return dateKey+'_'+cohort+'_'+taskIndex;}

function getDueDiff(dueDate){
  if(!dueDate) return null;
  var today=new Date(curDate); today.setHours(0,0,0,0);
  var due=new Date(dueDate); due.setHours(0,0,0,0);
  return Math.round((due-today)/(1000*60*60*24));
}
function dueBadgeHtml(dueDate){
  if(!dueDate) return '';
  var diff=getDueDiff(dueDate);
  var cls,label;
  if(diff<0){cls='due-overdue';label='D+'+Math.abs(diff)+' 지남';}
  else if(diff===0){cls='due-soon';label='D-day';}
  else if(diff<=3){cls='due-soon';label='D-'+diff;}
  else{cls='due-normal';label='D-'+diff;}
  return '<span class="due-badge '+cls+'">'+label+'</span>';
}
function priorityBadgeHtml(priority){
  return '<span class="priority-badge p-'+(priority||'none')+'">'+( PRIORITY_SHORT[priority]||'미분류' )+'</span>';
}
function priorityTagHtml(priority){
  if(!priority) return '';
  var label={DO:'긴급',DELEGATE:'위임',SCHEDULE:'중요',ELIMINATE:'낮음'}[priority]||'';
  var title={DO:'긴급 · 중요',DELEGATE:'긴급 · 안중요',SCHEDULE:'중요 · 안긴급',ELIMINATE:'둘 다 아님'}[priority]||'';
  if(!label) return '';
  return '<span class="ptag ptag-'+priority+'" title="'+title+'">'+label+'</span>';
}

function shouldShowAutolab(item,curKey){
  var info=autolabChecks[alKey(item)]||{};
  var done=!!info.checked,cd=info.completedDate||'';
  if(item.dateKey>curKey) return false;
  if(item.dateKey===curKey) return true;
  if(!done) return true;
  return cd!==''&&curKey<=cd;
}
function shouldShowAutolabMatrix(item){return true;}
function shouldShowCohortTask(dateKey,cohort,taskIndex,curKey){
  var info=checks[cohortCheckKey(dateKey,cohort,taskIndex)]||{};
  var done=!!info.checked,cd=info.completedDate||'';
  if(dateKey===curKey) return true;
  if(dateKey>curKey) return false;
  if(!done) return true;
  return cd!==''&&curKey<=cd;
}

function toggleShowUnclassified(){
  showUnclassified=!showUnclassified;
  var btn=document.getElementById('toggle-unclassified-btn');
  btn.textContent=showUnclassified?'미분류 숨기기':'미분류 보이기';
  btn.className='toggle-done-btn'+(showUnclassified?' active':'');
  render();
}
function toggleShowDone(){
  showDone=!showDone;
  if(currentTab==='dashboard') showDoneDashboard=showDone;
  else if(currentTab.startsWith('matrix-')) showDoneMatrix=showDone;
  var btn=document.getElementById('toggle-done-btn');
  btn.textContent=showDone?'완료 숨기기':'완료 보이기';
  btn.className='toggle-done-btn'+(showDone?' active':'');
  render();
  if(currentTab.startsWith('matrix-')) renderMatrix(currentTab.replace('matrix-',''));
}
function switchTab(tab){
  currentTab=tab;
  var allTabs=['dashboard','matrix-강희준','matrix-송민호','matrix-안보람','history','cohort-schedule','cells','morning','plan'];
  allTabs.forEach(function(t){
    document.getElementById('tab-'+t).className='tab-btn'+(tab===t?' active':'');
    document.getElementById('view-'+t).style.display=tab===t?'':'none';
  });
  document.getElementById('date-nav-wrap').style.display=tab==='dashboard'?'flex':'none';
  var showToggleBtn=tab==='dashboard'||tab.startsWith('matrix-');
  document.getElementById('toggle-done-btn').style.display=showToggleBtn?'block':'none';
  document.getElementById('toggle-unclassified-btn').style.display=tab==='dashboard'?'block':'none';
  if(tab==='dashboard'){showDone=showDoneDashboard;}
  else if(tab.startsWith('matrix-')){showDone=showDoneMatrix;}
  var btn=document.getElementById('toggle-done-btn');
  btn.textContent=showDone?'완료 숨기기':'완료 보이기';
  btn.className='toggle-done-btn'+(showDone?' active':'');
  if(tab==='history') renderHistory();
  if(tab==='cohort-schedule') renderCohortScheduleMatrix();
  if(tab==='cells') renderCellStatus();
  if(tab==='morning') loadMorning();
  if(tab==='plan') renderPlan();
  if(tab.startsWith('matrix-')) renderMatrix(tab.replace('matrix-',''));
}

async function loadData(quiet){
  // quiet: 실시간 반영으로 다시 읽을 때는 로딩 화면 없이 바꿔 그린다
  if(!quiet) document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>데이터 불러오는 중...</div>';
  try {
    var results=await Promise.all([
      _sb.from('autolab_task').select('*').order('id'),
      _sb.from('autolab_check').select('*'),
      _sb.from('autolab_comment').select('*').order('id'),
      _sb.from('cohort_schedule').select('*').order('cohort').order('date_key'),
    ]);
    var taskRes=results[0],checkRes=results[1],commentRes=results[2],cohortRes=results[3];
    if(taskRes.error) throw taskRes.error;

    var todayKey=dk(new Date());
    var data={};
    var cohortOrderList=[];

    (cohortRes.data||[]).forEach(function(row){
      if(!data[row.cohort]){data[row.cohort]=[];cohortOrderList.push(row.cohort);}
      var parsed=parseTaskTextFront(row.raw_text||'');
      var _rd=new Date(row.date_key+'T00:00:00');var _DN=['일','월','화','수','목','금','토'];
      data[row.cohort].push({
        dateKey:row.date_key, dateLabel:(_rd.getMonth()+1)+'/'+('0'+_rd.getDate()).slice(-2), dayName:_DN[_rd.getDay()],
        isWeekend:_rd.getDay()===0||_rd.getDay()===6, rawText:row.raw_text||'', sheetRow:row.sheet_row,
        dbId:row.id, isWorkDay:parsed.isWorkDay, label:parsed.label, tasks:parsed.tasks, isOverdue:row.date_key<todayKey,
      });
    });

    data._autolab=(taskRes.data||[]).map(function(row){
      return {id:String(row.id),dateKey:row.start_date,task:row.task,person:row.person,
        priority:row.priority||'',dueDate:row.due_date||'',createdAt:row.created_at,
        description:row.description||'',isOverdue:row.start_date<todayKey,parentId:row.parent_id?String(row.parent_id):null,waitingOn:row.waiting_on||'',waitingSince:row.waiting_since||'',recheckDate:row.recheck_date||''};
    });

    var checksMap={},autolabChecksMap={};
    (checkRes.data||[]).forEach(function(row){
      if(row.type==='cohort') checksMap[row.item_key]={checked:!!row.checked,completedDate:row.completed_date||''};
      else autolabChecksMap['autolab_'+row.item_key]={checked:!!row.checked,completedDate:row.completed_date||''};
    });

    var commentsMap={};
    (commentRes.data||[]).forEach(function(row){
      var iid=String(row.task_id);
      if(!commentsMap[iid]) commentsMap[iid]=[];
      commentsMap[iid].push({id:String(row.id),itemId:iid,author:row.author,text:row.text,createdAt:row.created_at});
    });

    cohortOrderList.sort(function(a,b){return parseInt(b)-parseInt(a);});
    data._cohortOrder=cohortOrderList;
    data._checks=checksMap;
    data._autolabChecks=autolabChecksMap;
    data._autolabComments=commentsMap;

    allData=data; checks=checksMap; autolabChecks=autolabChecksMap;
    if(data._cohortOrder){cohortColorMap={};cohortColorIdx=0;data._cohortOrder.forEach(function(c){getCohortColor(c);});}
    render();
    if(currentTab.startsWith('matrix-')) renderMatrix(currentTab.replace('matrix-',''));
    if(currentTab==='history') renderHistory();
    if(currentTab==='plan') renderPlan();
  } catch(err){
    document.getElementById('content').innerHTML='<div class="loading" style="color:#FC5555">오류: '+(err.message||err)+'</div>';
  }
}

async function upsertCheck(type,itemKey,checked,completedDate){
  var res=await _sb.from('autolab_check').upsert(
    {type:type,item_key:itemKey,checked:checked,completed_date:completedDate||''},
    {onConflict:'item_key'}
  );
  if(res.error) showToast('체크 저장 실패');
}

function _buildPersonCardHtml(person,key){
  var autolab=allData._autolab||[];
  var personItems=autolab.filter(function(item){return item.person===person&&shouldShowAutolab(item,key)&&(showUnclassified||item.priority!=='');});
  var displayItems=showDone?personItems:personItems.filter(function(i){return !(autolabChecks[alKey(i)]||{}).checked;});
  displayItems.sort(function(a,b){
    var pa=PRIORITY_ORDER[a.priority];if(pa==null)pa=4;
    var pb=PRIORITY_ORDER[b.priority];if(pb==null)pb=4;
    if(pa!==pb) return pa-pb;
    var ad=a.dueDate||a.dateKey, bd=b.dueDate||b.dateKey;
    if(ad<bd) return -1;
    if(ad>bd) return 1;
    return 0;
  });
  var totalCount=personItems.length;
  var doneCount=personItems.filter(function(i){return !!(autolabChecks[alKey(i)]||{}).checked;}).length;
  var overdueCount=personItems.filter(function(i){return i.dateKey<key&&!(autolabChecks[alKey(i)]||{}).checked;}).length;
  var pc=getPersonColor(person);
  var pct=totalCount?Math.round(doneCount/totalCount*100):0;
  var h='<div class="person-autolab-card" data-person="'+person+'">';
  h+='<div class="person-autolab-header">';
  h+='<div class="person-id"><span class="person-autolab-name">'+person+'</span></div>';
  h+='<div class="person-meta">';
  if(overdueCount>0) h+='<span class="tag tag-danger">이월 '+overdueCount+'</span>';
  if(totalCount>0) h+='<span class="person-count"><b>'+doneCount+'</b><span class="person-count-sep">/</span>'+totalCount+'</span>';
  h+='</div></div>';
  h+='<div class="person-progress"><div class="person-progress-bar" style="width:'+pct+'%;background:var(--brand)"></div></div>';
  h+='<div class="person-autolab-body">';
  if(displayItems.length===0){
    h+='<div style="font-size:12px;color:#C9CDD4;padding:8px 0;text-align:center">'+(showDone?'오늘 공통업무 없음':'미완료 업무 없음')+'</div>';
  } else {
    displayItems.forEach(function(item){
      var info=autolabChecks[alKey(item)]||{};
      var done=!!info.checked,isOverdue=item.dueDate?(item.dueDate<key):(item.dateKey<key);
      var dueDiff=getDueDiff(item.dueDate);
      var isDueSoon=dueDiff!==null&&dueDiff>=0&&dueDiff<=3&&!done;
      h+='<div class="autolab-item'+(isOverdue&&!done?' overdue':isDueSoon?' due-soon':'')+(done?' done':'')+'">';
      h+='<div class="autolab-check-area">';
      h+='<div class="checkbox'+(done?' checked':'')+'" onclick="toggleAutolabCheck(\''+item.id+'\')">'+(done?'✓':'')+'</div>';
      h+='<div style="flex:1;min-width:0;cursor:pointer" onclick="openAutolabDetailModal(\''+item.id+'\')">';
      h+='<div class="autolab-task-text">'+item.task+'</div>'+parentTagHtml(item)+waitTagHtml(item);
      h+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">';
      if(isOverdue&&!done&&!item.dueDate) h+='<span class="overdue-badge">이월</span>';
      if(done) h+='<span class="done-badge">완료</span>';
      h+=priorityTagHtml(item.priority);
      h+=itemDateHtml(item);
      if(item.dueDate) h+=dueBadgeHtml(item.dueDate);
      h+='</div></div></div>';
      h+='<button class="autolab-action-btn del" onclick="deleteDashboardAutolab(\''+item.id+'\')">✕</button>';
      h+='</div>';
    });
  }
  h+='</div></div>';
  return h;
}
function render(){
  var key=dk(curDate);
  document.getElementById('date-label').textContent=dDisp(curDate);
  var cohortOrder=(allData._cohortOrder||[]).slice();
  var autolab=allData._autolab||[];
  var html='';

  html+='<div class="person-autolab-grid">';
  PERSONS.forEach(function(person){ html+=_buildPersonCardHtml(person,key); });
  html+='</div>';

  html+='<div class="cohort-grid">';
  var hasAny=false;
  cohortOrder.forEach(function(c){
    var rows=allData[c]||[],cc=getCohortColor(c);
    var todayData=null;
    rows.forEach(function(r){if(r.dateKey===key)todayData=r;});
    var overdueItems=[];
    rows.forEach(function(r){
      if(r.dateKey>=key||!r.tasks||!r.tasks.length) return;
      r.tasks.forEach(function(t,ti){
        if(!shouldShowCohortTask(r.dateKey,c,ti,key)) return;
        var ck=cohortCheckKey(r.dateKey,c,ti);
        var isDone=!!(checks[ck]||{}).checked;
        if(!showDone&&isDone) return;
        overdueItems.push({dateKey:r.dateKey,dateLabel:r.dateLabel,person:t.person,task:t.task,taskIndex:ti,isDone:isDone});
      });
    });
    var hasTodayTasks=todayData&&todayData.tasks&&todayData.tasks.length>0;
    var hasSchedule=hasTodayTasks||(todayData&&todayData.isWorkDay!==null);
    if(!hasSchedule&&overdueItems.length===0) return;
    hasAny=true;
    var total=0,done=0;
    if(hasTodayTasks) todayData.tasks.forEach(function(t,ti){total++;if((checks[cohortCheckKey(key,c,ti)]||{}).checked)done++;});
    var pct=total?Math.round(done/total*100):0;
    var undoneOverdue=overdueItems.filter(function(i){return !i.isDone;}).length;
    html+='<div class="cohort-card"><div class="cohort-card-header">';
    html+='<span class="cohort-num">'+c+'<span class="cohort-num-suffix">기</span></span><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">';
    if(todayData&&todayData.isWorkDay!==null){
      if(todayData.isWorkDay) html+='<span class="tag tag-success">근무</span>';
      else html+='<span class="tag tag-neutral">휴무</span>';
    }
    
    if(todayData&&todayData.label) html+='<span class="tag tag-brand">'+todayData.label+'</span>';
    if(undoneOverdue>0) html+='<span class="tag tag-danger">이월 '+undoneOverdue+'</span>';
    
    
    html+='</div></div><div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%;background:var(--brand)"></div></div>';
    html+='<div class="cohort-card-body">';

    if(overdueItems.length>0){
      html+='<div class="overdue-section-label">미완료 이월</div>';
      overdueItems.forEach(function(item){
        var pc=getPersonColor(item.person);
        html+='<div class="assignee-row"><span class="a-chip" style="color:'+pc.text+'">'+item.person+'</span>';
        html+='<div class="task-list"><div class="task-item overdue-item'+(item.isDone?' done':'')+'" onclick="toggleCohortOverdueCheck(\''+item.dateKey+'\',\''+c+'\','+item.taskIndex+')">';
        html+='<div class="checkbox'+(item.isDone?' checked':'')+'">'+( item.isDone?'✓':'' )+'</div>';
        html+='<span class="task-text">'+item.task+'</span>';
        if(!item.isDone) html+='<span class="overdue-badge">'+item.dateLabel+'</span>';
        if(item.isDone) html+='<span class="done-badge">완료</span>';
        html+='</div></div></div>';
      });
      if(hasTodayTasks) html+='<div style="border-top:1px solid var(--border-subtle);margin:8px 0"></div>';
    }
    if(hasTodayTasks){
      var grouped={},order=[];
      todayData.tasks.forEach(function(t){
        if(!grouped[t.person]){grouped[t.person]=[];order.push(t.person);}
        grouped[t.person].push(t.task);
      });
      order.forEach(function(person){
        var pc=getPersonColor(person);
        html+='<div class="assignee-row"><span class="a-chip" style="color:'+pc.text+'">'+person+'</span>';
        html+='<div class="task-list">';
        grouped[person].forEach(function(taskText){
          var ti=0;
          todayData.tasks.forEach(function(t,idx){if(t.person===person&&t.task===taskText)ti=idx;});
          var isDone=!!(checks[cohortCheckKey(key,c,ti)]||{}).checked;
          if(!showDone&&isDone) return;
          html+='<div class="task-item'+(isDone?' done':'')+'" onclick="toggleCheck(\''+key+'\',\''+c+'\','+ti+')">';
          html+='<div class="checkbox'+(isDone?' checked':'')+'">'+( isDone?'✓':'' )+'</div>';
          html+='<span class="task-text">'+taskText+'</span></div>';
        });
        html+='</div></div>';
      });
    } else if(todayData&&todayData.isWorkDay===false&&overdueItems.length===0){
      html+='<div style="text-align:center;padding:10px 0;color:var(--text-tertiary);font-size:12px">휴무일</div>';
    }
    html+='</div></div>';
  });
  html+='</div>';
  if(!hasAny&&(allData._autolab||[]).filter(function(i){return shouldShowAutolab(i,dk(curDate));}).length===0){
    html='<div class="empty-day">'+(curDate.getDay()===0||curDate.getDay()===6?'주말이에요':'이 날은 등록된 일정이 없어요')+'</div>';
  }
  document.getElementById('content').innerHTML=html;
}
