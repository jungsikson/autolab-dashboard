var historyPerson='강희준';
var historyPeriod='week';
var historyShowDone={};

function renderHistory(){
  var autolab=allData._autolab||[];
  var today=new Date(); today.setHours(0,0,0,0);
  var todayKey=dk(today);
  var startDate=new Date(today),endDate=new Date(today);
  if(historyPeriod==='week'){
    var day=today.getDay();
    startDate.setDate(today.getDate()-(day===0?6:day-1));
  } else if(historyPeriod==='lastweek'){
    var day2=today.getDay();
    startDate.setDate(today.getDate()-(day2===0?13:day2+6));
    endDate.setDate(startDate.getDate()+6);
  } else if(historyPeriod==='month'){
    startDate.setDate(1);
  } else if(historyPeriod==='all'){
    startDate=new Date(2020,0,1);
  }
  var startKey=dk(startDate),endKey=dk(endDate);
  var items=autolab.filter(function(i){return i.person===historyPerson&&i.dateKey>=startKey&&i.dateKey<=endKey;});
  var groups={};
  items.forEach(function(item){var k=item.dateKey;if(!groups[k])groups[k]=[];groups[k].push(item);});
  var dateKeys=Object.keys(groups).sort().reverse();

  var html='<div class="history-wrap">';
  html+='<div class="history-toolbar">';
  html+='<span style="font-size:13px;font-weight:700">업무 히스토리</span>';
  html+='<select onchange="historyPerson=this.value;renderHistory()">';
  PERSONS.forEach(function(p){html+='<option value="'+p+'"'+(historyPerson===p?' selected':'')+'>'+p+'</option>';});
  html+='</select>';
  html+='<select onchange="historyPeriod=this.value;renderHistory()">';
  [['today','오늘'],['week','이번 주'],['lastweek','지난 주'],['month','이번 달'],['all','전체']].forEach(function(opt){
    html+='<option value="'+opt[0]+'"'+(historyPeriod===opt[0]?' selected':'')+'>'+opt[1]+'</option>';
  });
  html+='</select>';
  html+='</div><div class="history-body">';

  if(dateKeys.length===0){
    html+='<div style="text-align:center;padding:40px;color:#8A8F96">해당 기간에 업무가 없어요</div>';
  } else {
    dateKeys.forEach(function(dateKey){
      var dayItems=groups[dateKey];
      var doneItems=dayItems.filter(function(i){return !!(autolabChecks[alKey(i)]||{}).checked;});
      var undoneItems=dayItems.filter(function(i){return !(autolabChecks[alKey(i)]||{}).checked;});
      var d=new Date(dateKey); d.setHours(12);
      var dateLabel=(d.getMonth()+1)+'월 '+d.getDate()+'일('+DAYS[d.getDay()]+')';
      if(dateKey===todayKey) dateLabel='오늘 — '+dateLabel;
      html+='<div class="history-date-group">';
      html+='<div class="history-date-label">'+dateLabel+' ('+dayItems.length+'건)</div>';
      undoneItems.forEach(function(item){
        html+='<div class="history-item">';
        html+='<div class="checkbox" style="cursor:pointer;flex-shrink:0" onclick="toggleAutolabCheckHistory(\''+item.id+'\',\''+dateKey+'\')"></div>';
        html+='<div style="flex:1;min-width:0;cursor:pointer" onclick="openAutolabDetailModal(\''+item.id+'\')">';
        html+='<div class="history-task-text">'+item.task+'</div>';
        html+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px">'+priorityBadgeHtml(item.priority)+itemDateHtml(item)+(item.dueDate?dueBadgeHtml(item.dueDate):'')+'</div></div>';
        html+='</div>';
      });
      if(doneItems.length>0){
        var isOpen=historyShowDone[dateKey]!==false;
        html+='<div class="history-done-toggle" onclick="toggleHistoryDone(\''+dateKey+'\')">';
        html+=(isOpen?'▼':'▶')+' 완료된 업무 '+doneItems.length+'건</div>';
        if(isOpen){
          doneItems.forEach(function(item){
            var info=autolabChecks[alKey(item)]||{};
            html+='<div class="history-item done">';
            html+='<div class="checkbox checked" style="cursor:pointer;flex-shrink:0" onclick="toggleAutolabCheckHistory(\''+item.id+'\',\''+dateKey+'\')">✓</div>';
            html+='<div style="flex:1;min-width:0;cursor:pointer" onclick="openAutolabDetailModal(\''+item.id+'\')">';
            html+='<div class="history-task-text">'+item.task+'</div>';
            html+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px">';
            html+=priorityBadgeHtml(item.priority)+itemDateHtml(item);
            if(item.dueDate) html+=dueBadgeHtml(item.dueDate);
            if(info.completedDate) html+='<span style="font-size:12px;color:#1B8E4D;font-weight:500">✓ '+info.completedDate+'</span>';
            html+='</div></div></div>';
          });
        }
      }
      html+='</div>';
    });
  }
  html+='</div></div>';
  document.getElementById('history-content').innerHTML=html;
}

function toggleHistoryDone(dateKey){historyShowDone[dateKey]=historyShowDone[dateKey]===false?true:false;renderHistory();}

function toggleAutolabCheckHistory(id,dateKey){
  var key='autolab_'+String(id);
  var current=(autolabChecks[key]||{}).checked;
  var newChecked=!current;
  autolabChecks[key]={checked:newChecked,completedDate:newChecked?dateKey:''};
  renderHistory();
  upsertCheck('autolab',String(id),newChecked,newChecked?dateKey:'');
}

var matrixAddingIn={};
var matrixConfirming={};

function renderMatrix(person){

    }
    items.forEach(function(item){
      var info=autolabChecks[alKey(item)]||{};

      h+='<div class="matrix-item'+(done?' done':'')+(isOverdue?' matrix-overdue':'')+'" draggable="true" ondragstart="onDragStart(event,\''+item.id+'\')" ondragend="onDragEnd(event)">';
      h+='<div class="checkbox'+(done?' checked':'')+'" onclick="toggleAutolabCheck(\''+item.id+'\')">'+(done?'✓':'')+'</div>';
      h+='<div style="flex:1;min-width:0;cursor:pointer" onclick="openAutolabDetailModal(\''+item.id+'\')">';

      due_date:dueDate||null,created_at:createdAt,description:'',

}

function parseTaskTextFront(text){
  var result={isWorkDay:null,label:null,tasks:[]};
  if(!text||!text.trim()) return result;
  text.split('\n').forEach(function(line){
    line=line.trim(); if(!line) return;
    var colonIdx=line.indexOf(':');
    if(colonIdx>0){
      var before=line.substring(0,colonIdx).trim(),after=line.substring(colonIdx+1).trim();
      if(before==='근무'){result.isWorkDay=(after.trim()==='O');return;}
      if(before==='라벨'){result.label=after.trim()||null;return;}
      if(/^[가-힣]{2,6}$/.test(before)&&after){
        after.split(',').map(function(t){return t.trim();}).filter(Boolean).forEach(function(t){result.tasks.push({person:before,task:t});});
        return;
      }
    }
    var cleaned=line.replace(/\s+/g,' ').trim();
    if(cleaned) result.tasks.push({person:'공통',task:cleaned});
  });
  return result;
}

function renderCohortScheduleMatrix(){
  var cohorts=Object.keys(allData).filter(function(k){return k!=='_autolab'&&k!=='_cohortOrder'&&k!=='_checks'&&k!=='_autolabChecks'&&k!=='_autolabComments';});
  cohorts.sort(function(a,b){return parseInt(a)-parseInt(b);});
  if(!cohorts.length){document.getElementById('cohort-schedule-content').innerHTML='<div style="padding:32px;text-align:center;color:#8A8F96;">기수 데이터가 없어요</div>';return;}

  var todayKey=dk(new Date());

  // 오늘 이후 일정이 하나라도 있는 기수만 (진행 중인 기수)
  cohorts=cohorts.filter(function(c){
    return (allData[c]||[]).some(function(r){return r.dateKey>=todayKey;});
  });

  // 필터된 기수의 날짜만 모으기
  var dateSet={};
  cohorts.forEach(function(c){
    (allData[c]||[]).forEach(function(r){
      dateSet[r.dateKey]={dateLabel:r.dateLabel,dayName:r.dayName,isWeekend:r.isWeekend};
    });
  });
  var dates=Object.keys(dateSet).sort();

  var byDate={};
  cohorts.forEach(function(c){
    (allData[c]||[]).forEach(function(r){
      if(!byDate[r.dateKey]) byDate[r.dateKey]={};
      byDate[r.dateKey][c]=r;
    });
  });

  var html='<div style="padding:16px;overflow-x:auto">';
  html+='<table class="cohort-matrix-table"><thead><tr>';
  html+='<th class="cm-date-cell">날짜</th>';
  cohorts.forEach(function(c){html+='<th>'+c+'기</th>';});
  html+='</tr></thead><tbody>';

  dates.forEach(function(dateKey){
    var di=dateSet[dateKey];
    var isToday=dateKey===todayKey;
    var rowStyle=di.isWeekend?'opacity:0.5':'';
    html+='<tr style="'+rowStyle+'">';
    var dStyle='font-size:12px;font-weight:'+(isToday?'700':'500')+';color:'+(di.isWeekend?'#8A8F96':isToday?'#C2410C':'#46494F')+';'+(isToday?'background:#FFF3E8;':'');
    html+='<td class="cm-date-cell" style="'+dStyle+'">'+di.dateLabel+'('+di.dayName+')'+(isToday?' ◀':'')+'</td>';

    cohorts.forEach(function(c){
      var r=(byDate[dateKey]||{})[c];
      var cellHtml='',cellCls='';
      if(r){
        if(r.isWorkDay===false){
          cellCls='cm-off';
          if(r.label){cellHtml='<span style="font-size:12px;color:#8A8F96">'+r.label+'</span>';}
          else if(r.tasks&&r.tasks.length>0){cellHtml='<span style="font-size:11px;color:#8A8F96">'+r.tasks[0].task.substring(0,14)+'</span>';}
          else{cellHtml='<span style="color:#C9CDD4;font-size:11px">–</span>';}
        } else if(r.label){
          var lbl=r.label;
          cellCls=lbl.indexOf('현장')>=0?'cm-field':lbl.indexOf('오토랩')>=0?'cm-autolab':'';
          cellHtml='<span style="font-size:12px;font-weight:600">'+lbl+'</span>';
        } else if(r.isWorkDay===true){
          cellHtml='<span style="color:#1B8E4D;font-size:11px">근무</span>';
        } else if(r.tasks&&r.tasks.length>0){
          cellHtml='<span style="font-size:11px;color:#6D727A">'+r.tasks[0].task.substring(0,12)+'</span>';
        }
      }
      var tdStyle=isToday?'outline:2px solid #FE5B1B;outline-offset:-2px':'';
      html+='<td class="'+cellCls+'" style="'+tdStyle+'">'+cellHtml+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  document.getElementById('cohort-schedule-content').innerHTML=html;
}

async function renderCellStatus(){
  var el=document.getElementById('cells-content');
  el.innerHTML='<div class="loading"><div class="spinner"></div>셀현황 불러오는 중...</div>';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  try{
    var url='https://docs.google.com/spreadsheets/d/'+CELL_SHEET_ID+'/gviz/tq?tqx=out:json&headers=0&sheet='+encodeURIComponent(CELL_SHEET_NAME);
    var resp=await fetch(url,{cache:'no-store'});
    var txt=await resp.text();
    var json=JSON.parse(txt.substring(txt.indexOf('(')+1,txt.lastIndexOf(')')));
    var rows=(json.table&&json.table.rows)||[];
    var grid=rows.map(function(r){return (r.c||[]).map(function(c){return c&&c.v!=null?c.v:'';});});
    if(!grid.length){el.innerHTML='<div style="padding:32px;text-align:center;color:var(--text-secondary)">셀현황 데이터가 없어요</div>';return;}
    var colCount=0;
    grid.forEach(function(row){for(var j=0;j<row.length;j++){if(String(row[j]==null?'':row[j]).trim()!=='')colCount=Math.max(colCount,j+1);}});
    var head=grid[0].slice();
    if(colCount>0&&String(head[colCount-1]==null?'':head[colCount-1]).trim()===''){head[colCount-1]='합계';}
    var html='<div style="padding:16px;overflow-x:auto">';

    html+='</tr></thead><tbody>';
    for(var i=1;i<grid.length;i++){
      var row=grid[i];
      var label=String(row[0]||'').trim();
      var isSummary=(label==='셀장'||label==='ZONE'||label==='인원');
      html+='<tr>';
      for(var j=0;j<colCount;j++){
        var v=row[j]==null?'':row[j];
        var style=j===0?'text-align:left;font-weight:600;color:var(--text-secondary);white-space:nowrap':(isSummary?'font-weight:600;color:var(--text-primary)':'color:var(--text-primary)');
        html+='<td style="'+style+'">'+esc(v)+'</td>';
      }
      html+='</tr>';
    }
    html+='</tbody></table>';
    html+='<div style="padding:10px 4px 0;font-size:var(--text-xs);color:var(--text-tertiary)">시트 "셀현황(자동)" 실시간 반영 · 새로고침하면 최신</div>';
    html+='</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div style="padding:32px;text-align:center;color:var(--text-secondary)">셀현황을 불러오지 못했어요<br><span style="font-size:12px;color:var(--text-tertiary)">'+esc(e.message||e)+'</span></div>';
  }
}

    if(person) updateData.person=person;
    if(startDate) updateData.start_date=startDate;
    var res=await _sb.from('autolab_task').update(updateData).eq('id',parseInt(autolabEditId));
    if(res.error) throw res.error;
    var item=(allData._autolab||[]).find(function(i){return String(i.id)===String(autolabEditId);});
    if(item){item.task=task;if(person)item.person=person;item.priority=priority;if(startDate)item.dateKey=startDate;item.dueDate=dueDate||'';}
    if(isDone!==prevDone){
      var cd=isDone?dk(new Date()):'';
      autolabChecks['autolab_'+String(autolabEditId)]={checked:isDone,completedDate:cd};
      await upsertCheck('autolab',String(autolabEditId),isDone,cd);
    }

  } catch(err){

}

var detailModalId=null;

  var item=(allData._autolab||[]).find(function(i){return String(i.id)===String(id);});
  if(!item) return;
  detailModalId=id;

function _renderOneComment(c){

    +'<button onclick="deleteDetailComment(\''+c.id+'\',\''+c.itemId+'\')" style="font-size:11px;border:none;background:none;cursor:pointer;padding:2px;color:#C9CDD4" title="삭제">✕</button>'

async function submitDetailComment(){
  var author=document.getElementById('detail-comment-author').value;
  var text=document.getElementById('detail-comment-input').value.trim();
  if(!text){showToast('댓글을 입력하세요');return;}
  document.getElementById('detail-comment-input').value='';
  var now=new Date();
  var createdAt=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  try {
    var res=await _sb.from('autolab_comment').insert({task_id:String(detailModalId),author:author,text:text,created_at:createdAt}).select().single();
    if(res.error) throw res.error;
    var comment={id:String(res.data.id),itemId:String(detailModalId),author:author,text:text,createdAt:createdAt};
    var el=document.getElementById('detail-modal-comments');
    if(el){el.insertAdjacentHTML('beforeend',_renderOneComment(comment));el.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});}

    +'<button onclick="cancelEditComment(\''+commentId+'\',\''+esc+'\')" style="font-size:12px;padding:4px 12px;border-radius:8px;border:1px solid #C9CDD4;cursor:pointer;background:#fff">취소</button>'

async function saveEditComment(commentId){

async function deleteDetailComment(commentId,itemId){

async function saveDetailEdit(){

  var item=(allData._autolab||[]).find(function(i){return String(i.id)===String(detailModalId);});

    if(isDone!==prevDone){
      var cd=isDone?dk(new Date()):'';
      autolabChecks['autolab_'+String(detailModalId)]={checked:isDone,completedDate:cd};
      await upsertCheck('autolab',String(detailModalId),isDone,cd);
    }
    exitDetailEdit();
    // refresh view mode display
    document.getElementById('detail-modal-title').textContent=task;
    var sub='담당자: '+person+'  ·  등록: '+(item?item.dateKey:'');
    if(dueDate){
      var diff=getDueDiff(dueDate);
      var dLabel,dColor;
      if(diff<0){dLabel=(Math.abs(diff))+'일 지연';dColor='#C8392E';}
      else if(diff===0){dLabel='오늘 마감';dColor='#8A6D00';}
      else if(diff<=3){dLabel='D-'+diff;dColor='#8A6D00';}
      else{dLabel='D-'+diff;dColor='var(--text-tertiary)';}
      sub+='  ·  <span style="color:'+dColor+';font-weight:600">'+dLabel+'</span>';
    }
    if(isDone) sub+='  ·  <span style="color:#1B8E4D;font-weight:500">완료</span>';

    if(dueDate) badges+=dueBadgeHtml(dueDate);
    if(isDone) badges+='<span class="done-badge">완료</span>';

    render();

    if(currentTab==='history') renderHistory();
    showToast('저장됐어요!');
  } catch(err){
    showToast('오류: '+(err.message||err));
  }
  btn.textContent='저장'; btn.disabled=false;
}

document.getElementById('detail-modal-desc').addEventListener('keydown',function(e){
  if(e.isComposing) return;
  var ta=this,val=ta.value,pos=ta.selectionStart;
  var ls=val.lastIndexOf('\n',pos-1)+1;
  var lt=val.substring(ls,pos);
  if(e.key===' '&&lt==='-'){
    e.preventDefault();
    ta.value=val.substring(0,ls)+'• '+val.substring(pos);
    ta.selectionStart=ta.selectionEnd=ls+2;
  } else if(e.key==='Enter'){
    if(lt==='• '){e.preventDefault();ta.value=val.substring(0,ls)+val.substring(pos);ta.selectionStart=ta.selectionEnd=ls;}
    else if(lt.startsWith('• ')){e.preventDefault();var ins='\n• ';ta.value=val.substring(0,pos)+ins+val.substring(pos);ta.selectionStart=ta.selectionEnd=pos+ins.length;}
  }
});

loadData();

<script>
// =============================================
// 아침판 — 봇 DM(통화 할 일·슬랙 점검·하루 요약)을 한 화면으로. 표 morning_item, 누르면 바로 할 일에 반영
// 탭은 ?morning=1 로 한 번 열면 이 브라우저에서만 보인다(강희준 개인용)
// =============================================
var MP={rows:[],date:null,sel:null,filter:'left',busy:false,person:'강희준'};
(function(){
  try{
    var qs=new URLSearchParams(location.search);
    if(qs.get('morning')==='1') localStorage.setItem('autolab_morning','1');
    if(localStorage.getItem('autolab_morning')==='1') document.getElementById('nav-morning').style.display='';
    // DM의 "정할 것 열기" 주소(?morning=1)로 들어오면 바로 그 화면을 연다(저장소가 막힌 폰 브라우저에서도)
    if(qs.get('morning')==='1'){ document.getElementById('nav-morning').style.display=''; setTimeout(function(){switchTab('morning');},0); }
  }catch(e){}
})();
function mpEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mpAct(r){return r.kind!=='info';}
function mpSuggest(r){
  if(r.kind==='merge') return '#'+r.task_id+'에 덧붙이기';
  if(r.kind==='new') return '할 일에 넣기';
  if(r.kind==='done') return '이미 끝남';
  if(r.kind==='read') return '읽음';
  return '내일 다시';
}
function mpButtons(r){
  if(r.kind==='progress') return [['later','내일 다시'],['done','완료'],['mute','그만 알림']];
  var a=[];
  if(r.kind==='merge') a.push(['merge','#'+r.task_id+'에 덧붙이기'],['add','다른 일 · 새로 넣기']);
  if(r.kind==='new') a.push(['add','할 일에 넣기']);
  if(r.kind==='done') a.push(['done','이미 끝남'],['add','할 일에 넣기']);
  if(r.kind==='read') a.push(['read','읽음'],['add','할 일에 넣기']);
  if(r.kind!=='done') a.push(['done','이미 끝남']);
  a.push(['later','내일 다시'],['mute','그만 알림']);
  return a;
}
async function loadMorning(quiet){
  var box=document.getElementById('morning-content');
  if(!quiet) box.innerHTML='<div class="loading"><div class="spinner"></div>아침판 불러오는 중...</div>';
  var last=await _sb.from('morning_item').select('edition_date').eq('person',MP.person).order('edition_date',{ascending:false}).limit(1);
  if(last.error){box.innerHTML='<div class="loading">불러오기 실패: '+mpEsc(last.error.message)+'</div>';return;}
  if(!last.data.length){box.innerHTML='<div class="loading">아직 발행된 아침판이 없습니다.</div>';return;}
  MP.date=last.data[0].edition_date;
  // 오늘 판 전부 + 지난 판에서 아직 안 정한 항목(놓치지 않게 다음 판으로 넘어온다)
  var res=await _sb.from('morning_item').select('*').eq('person',MP.person)
    .or('edition_date.eq.'+MP.date+',and(decision.is.null,kind.neq.info)')
    .order('edition_date',{ascending:false}).order('sort');
  if(res.error){box.innerHTML='<div class="loading">불러오기 실패: '+mpEsc(res.error.message)+'</div>';return;}
  // 지난 판에서 넘어온 항목은 묶음 이름에 날짜를 붙여 맨 뒤로
  MP.rows=res.data.map(function(r){
    if(r.edition_date!==MP.date){var d=new Date(r.edition_date+'T00:00:00');r=Object.assign({},r,{grp:'지난 판 '+(d.getMonth()+1)+'/'+d.getDate()+' · '+r.grp,sort:10000+r.sort});}
    return r;
  }).sort(function(a,b){return a.sort-b.sort;});
  var acts=MP.rows.filter(mpAct);
  if(!MP.sel||!acts.some(function(r){return r.id===MP.sel;})){var f=acts.filter(function(r){return !r.decision;})[0]||acts[0];MP.sel=f?f.id:null;}
  renderMorning();
}
function renderMorning(){
  var acts=MP.rows.filter(mpAct), info=MP.rows.filter(function(r){return !mpAct(r);});
  var nNew=acts.filter(function(r){return r.kind==='new';}).length, nMerge=acts.filter(function(r){return r.kind==='merge';}).length;
  var nDec=acts.filter(function(r){return r.decision;}).length;
  var d=new Date(MP.date+'T00:00:00'), wd='일월화수목금토'[d.getDay()];
  var html='<div class="mp-head"><h1>'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+wd+'요일 아침, '+(acts.length-nDec?'남은 정할 것 '+(acts.length-nDec)+'건':'오늘 정할 것을 다 정했습니다')+'</h1>'+
    '<p>오늘 '+acts.length+'건 중 '+nDec+'건 정함 · 새로 넣을 후보 <b>'+nNew+'건</b>, 기존 할 일에 덧붙일 후보 <b>'+nMerge+'건</b></p></div>';
  // 화면을 탭으로 나눈다: 정할 것 / 읽을거리
  MP.view=MP.view||'decide';
  html+='<div class="mp-views">'+[['decide','정할 것',(acts.length-nDec)],['read','읽을거리',info.length]].map(function(v){
    return '<button class="mp-view'+(MP.view===v[0]?' on':'')+'" onclick="MP.view=\''+v[0]+'\';renderMorning()">'+v[1]+' <span>'+v[2]+'</span></button>';}).join('')+'</div>';
  if(MP.view==='read'){ html+=mpReadHtml(info); document.getElementById('morning-content').innerHTML=html; return; }
  html+=mpWaitHtml();
  // 판정 띠
  var prev=null, cells=acts.map(function(r){var first=r.grp!==prev;prev=r.grp;
    return '<button class="mp-cell'+(first?' first':'')+(r.decision?' done':(r.kind==='new'?' new':''))+(MP.sel===r.id?' sel':'')+'" title="'+mpEsc((r.who||'')+' · '+r.hl)+'" aria-label="'+mpEsc(r.hl)+'" onclick="mpPick('+r.id+')"></button>';}).join('');
  var gs=[],last=null; acts.forEach(function(r){if(r.grp!==last){gs.push([r.grp,0]);last=r.grp;}gs[gs.length-1][1]++;});
  html+='<div class="mp-strip"><div class="mp-strip-head"><b>오늘 항목 판정</b><div class="mp-legend"><span><i style="background:var(--accent)"></i>정함 '+nDec+'</span><span><i style="background:var(--accent-subtle)"></i>새로 넣을 후보</span><span><i style="background:var(--border-subtle)"></i>남음 '+(acts.length-nDec)+'</span></div></div>'+
    '<div class="mp-cells">'+cells+'</div><div class="mp-groups">'+gs.map(function(g){return mpEsc(g[0])+' '+g[1];}).join(' · ')+'</div></div>';
  // 목록
  var list=acts.filter(function(r){return MP.filter==='all'||(MP.filter==='left'?!r.decision:!!r.decision);});
  var rows='',lg=null;
  list.forEach(function(r){
    if(r.grp!==lg){rows+='<div class="mp-grp">'+mpEsc(r.grp)+'</div>';lg=r.grp;}
    rows+='<button class="mp-row'+(r.decision?' decided':'')+(MP.sel===r.id?' cur':'')+'" onclick="mpPick('+r.id+')"><span class="dot"></span><span class="who">'+mpEsc((r.who?r.who+' · ':'')+r.hl)+'</span><span class="when">'+mpEsc(r.when_label||'')+'</span><span class="l2">'+(r.decision?'정함: '+mpEsc(r.decision_label):'→ <b>'+mpEsc(mpSuggest(r))+'</b>')+'</span></button>';
  });
  if(!rows) rows='<p class="mp-grp" style="padding:24px 10px">'+(MP.filter==='left'?'오늘 정할 것은 다 정했습니다.':'아직 정한 것이 없습니다.')+'</p>';
  var tabs=[['left','남은 것'],['all','전체'],['done','정한 것']].map(function(t){return '<button class="mp-tab'+(MP.filter===t[0]?' on':'')+'" onclick="MP.filter=\''+t[0]+'\';renderMorning()">'+t[1]+'</button>';}).join('');
  html+='<div class="mp-work'+(MP.open?' open':'')+'"><div class="mp-list"><div class="mp-tabs">'+tabs+'</div>'+rows+'</div><article class="mp-detail">'+mpDetail()+'</article></div>';
  document.getElementById('morning-content').innerHTML=html;

// 기다림 중 다시 볼 날이 된 할 일 — 봇 없이 할 일 표에서 바로 계산
function mpWaitDue(){
  var today=dk(new Date());
  return (allData._autolab||[]).filter(function(i){return i.person===MP.person&&i.waitingOn&&i.recheckDate&&i.recheckDate<=today&&!(autolabChecks[alKey(i)]||{}).checked;})
    .sort(function(a,b){return a.recheckDate.localeCompare(b.recheckDate);});
}
function mpWaitHtml(){
  var list=mpWaitDue(); if(!list.length) return '';
  var today=new Date(); today.setHours(0,0,0,0);
  return '<div class="mp-wait"><div class="mp-wait-h">다시 볼 기다림 '+list.length+'건 — 답이 왔는지 확인하세요</div>'+list.map(function(i){
    var days=i.waitingSince?Math.round((today-new Date(i.waitingSince+'T00:00:00'))/86400000):null;
    return '<div class="mp-wait-row"><button class="mp-link mp-wait-t" onclick="openAutolabDetailModal(\''+i.id+'\')">#'+i.id+' '+_alEsc(i.task)+'</button>'+
      '<span class="mp-wait-who">'+_alEsc(i.waitingOn)+(days!=null?' · '+days+'일째':'')+'</span>'+
      '<button class="mp-btn" onclick="mpWaitAct(\''+i.id+'\',\'got\')">답 받음</button>'+
      '<button class="mp-btn" onclick="mpWaitAct(\''+i.id+'\',\'more\',this)">더 기다리기…</button>'+
      '<button class="mp-btn" onclick="mpWaitAct(\''+i.id+'\',\'done\')">완료</button></div>';}).join('')+'</div>';
}
async function mpWaitAct(id,k,btn){
  var it=_alFind(id); if(!it) return;
  if(k==='more'){ duePicker(btn,it.recheckDate,async function(v){ if(!v) return; var r=await _sb.from('autolab_task').update({recheck_date:v}).eq('id',Number(id)); if(r.error){showToast('실패: '+r.error.message);return;} it.recheckDate=v; showToast('#'+id+' '+v.slice(5).replace('-','/')+'에 다시'); renderMorning(); }); return; }
  if(k==='got'){ var r=await _sb.from('autolab_task').update({waiting_on:null,waiting_since:null,recheck_date:null}).eq('id',Number(id)); if(r.error){showToast('실패: '+r.error.message);return;}
    it.waitingOn='';it.waitingSince='';it.recheckDate=''; showToast('#'+id+' 기다림 끝 — 이제 내 할 일'); renderMorning(); return; }
  if(k==='done'){ var cd=dk(new Date()); autolabChecks[alKey(it)]={checked:true,completedDate:cd}; await upsertCheck('autolab',String(id),true,cd); showToast('#'+id+' 완료'); renderMorning(); }
}
function mpReadHtml(info){

  var li=function(r,withLink){return '<li>'+(withLink&&r.link?'<a href="'+mpEsc(r.link)+'" target="_blank" rel="noopener">'+mpEsc(r.hl)+'</a>':'<b>'+mpEsc(r.hl)+'</b>')+'<small>'+mpEsc(r.body)+'</small></li>';};

// 덧붙이기·진척 대상 할 일을 번호만이 아니라 내용으로 보여 준다(무엇에 붙일지 보고 정하게)
var MP_PRIO={DO:'긴급+중요',DELEGATE:'긴급+안중요',SCHEDULE:'중요+안긴급',ELIMINATE:'둘다아님','':'미분류'};
function mpTaskPreview(taskId){
  var t=(allData._autolab||[]).find(function(i){return String(i.id)===String(taskId);});
  if(!t) return '<div class="mp-target"><p>#'+taskId+' 할 일을 찾지 못했습니다(완료됐거나 지워짐).</p></div>';
  var lines=(t.description||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var body=lines.filter(function(s){return !/^\[(수동 등록|슬랙 캡처|정할 것|아침판|진척|메모)/.test(s)&&!/^\((정할 것|아침판) #/.test(s)&&!/^https?:/.test(s);}).slice(0,3);
  var last=lines.filter(function(s){return /^\[(진척|메모)/.test(s);}).pop();
  var meta=[MP_PRIO[t.priority]||t.priority, t.dueDate?'마감 '+t.dueDate:'', t.dateKey?'시작 '+t.dateKey:''].filter(Boolean).join(' · ');
  var src=((t.description||'').match(/https?:\/\/\S+/)||[])[0];
  if(src) meta+=' · <a href="'+mpEsc(src)+'" target="_blank" rel="noopener">출처 열기</a>';
  return '<div class="mp-target"><div class="mp-target-head"><b>#'+t.id+' '+mpEsc(t.task)+'</b><button class="mp-link" onclick="openAutolabDetailModal(\''+t.id+'\')">할 일 열기</button></div>'+
    '<p class="mp-target-meta">'+meta+'</p>'+
    (body.length?'<ul>'+body.map(function(s){return '<li>'+mpEsc(s.replace(/^[-•]\s*/,''))+'</li>';}).join('')+'</ul>':'')+
    (last?'<p class="mp-target-last">최근: '+mpEsc(last)+'</p>':'')+'</div>';
}
function mpDetail(){
  var r=MP.rows.filter(function(x){return x.id===MP.sel;})[0];
  if(!r) return '<p>왼쪽에서 항목을 고르세요.</p>';
  var m='';
  if(r.kind==='merge') m='이미 있는 것 같음: <b>#'+r.task_id+' '+mpEsc(r.task_title)+'</b>';

  else if(r.kind==='new') m='대시보드에 <b>같은 할 일 없음</b>';

  else m='대시보드 <b>#'+r.task_id+'</b> 진척';
  var note=(r.kind!=='done'&&r.note)?'<p style="margin-top:6px">'+mpEsc(r.note)+'</p>':'';
  var sug=mpSuggest(r);
  var prioChips=[['DO','긴급+중요'],['SCHEDULE','중요+안긴급'],['DELEGATE','긴급+안중요'],['ELIMINATE','둘다아님']].map(function(p){
    return '<label class="mp-chip"><input type="radio" name="mp-prio" value="'+p[0]+'"><span>'+p[1]+'</span></label>';}).join('');
  var memoBox='<div class="mp-memo"><textarea id="mp-memo" rows="2" placeholder="메모 — 할 일에 같이 남깁니다 (예: 희진님과 오프라인 논의, 월요일 확인 후 화요일 결정)"></textarea>'+
    '<label>마감 (새로 넣을 때만) <input type="date" id="mp-due"></label>'+
    '<div class="mp-fu"><input type="text" id="mp-fu" placeholder="후속 할 일 (예: 이수민 팀장 블랙박스 확인 결과 받기)"><input type="date" id="mp-fu-due" aria-label="후속 할 일 마감"></div>'+
    '<div class="mp-chips" role="radiogroup" aria-label="새로 생기는 할 일 우선순위">'+prioChips+'</div></div>';
  var acts=r.decision
    ?'<div class="mp-done"><span class="mp-pill">'+mpEsc(r.decision_label)+(r.decided_task_id?' · #'+r.decided_task_id:'')+(r.decided_via==='slack'?' · 슬랙':'')+'</span>'+
      (r.decided_task_id?'<button class="mp-link" onclick="openAutolabDetailModal(\''+r.decided_task_id+'\')">할 일 열기</button>':'')+
      (r.followup_task_id?'<span class="mp-pill gray">후속 #'+r.followup_task_id+'</span><button class="mp-link" onclick="openAutolabDetailModal(\''+r.followup_task_id+'\')">후속 열기</button>':'')+
      '<button class="mp-link" onclick="mpUndo('+r.id+')">되돌리기</button></div>'+
      (r.memo?'<p class="mp-memo-shown">📝 '+mpEsc(r.memo).replace(/\n/g,'<br>')+'</p>':'')+
      (r.decided_task_id?memoBox+'<div class="mp-acts"><button class="mp-btn"'+(MP.busy?' disabled':'')+' onclick="mpMemo('+r.id+')">메모 덧붙이기</button></div>':'')
    :memoBox+'<div class="mp-acts">'+mpButtons(r).map(function(b){
        return '<button class="mp-btn'+(b[1]===sug?' pri':'')+'"'+(MP.busy?' disabled':'')+' onclick="mpDecide('+r.id+',\''+b[0]+'\',\''+mpEsc(b[1])+'\')">'+mpEsc(b[1])+'</button>';}).join('')+
      (r.kind!=='progress'?'<button class="mp-btn"'+(MP.busy?' disabled':'')+' onclick="mpOpenPicker('+r.id+')">다른 할 일에 덧붙이기…</button>':'')+'</div>';
  return '<div><button class="mp-link mp-back" onclick="MP.open=false;renderMorning()">← 목록</button>'+
    '<h2>'+mpEsc(r.hl)+'</h2><p class="src">'+mpEsc((r.who||'')+(r.when_label?' · '+r.when_label:''))+'</p>'+
    (r.quote?'<blockquote>'+mpEsc(r.quote)+'</blockquote>':'')+(r.body?'<p class="body">'+mpEsc(r.body)+'</p>':'')+
    (r.link?'<a class="orig" href="'+mpEsc(r.link)+'" target="_blank" rel="noopener">'+mpEsc(r.link_label||'슬랙')+' 원문 열기</a>':'')+
    '<div class="mp-verdict"><p>'+m+'</p>'+((r.kind==='merge'||r.kind==='progress')&&r.task_id?mpTaskPreview(r.task_id):'')+note+acts+'</div></div>'+
    '<div class="mp-kv"><div><span>출처</span><span>'+mpEsc(r.source)+'</span></div><div><span>묶음</span><span>'+mpEsc(r.grp)+'</span></div><div><span>봇 제안</span><span>'+mpEsc(sug)+'</span></div><div><span>상태</span><span>'+(r.decision?'<span class="mp-pill">정함</span>':'<span class="mp-pill gray">남음</span>')+'</span></div></div>';
}
function mpPick(id){MP.sel=id;MP.open=true;renderMorning();}

// 덧붙일 할 일 찾기 — 봇 제안이 틀렸을 때 검색해서 고른다(Linear의 '중복 처리'처럼 한 창에서)
var MPP={rowId:null,list:[],idx:0};
function mpOpenPicker(rowId){
  var r=MP.rows.filter(function(x){return x.id===rowId;})[0]; if(!r) return;
  MPP.rowId=rowId; MPP.idx=0;
  var bg=document.getElementById('mp-picker');
  if(!bg){bg=document.createElement('div');bg.id='mp-picker';bg.className='mpp-bg';
    bg.innerHTML='<div class="mpp" role="dialog" aria-label="덧붙일 할 일 찾기"><input id="mpp-q" type="text" placeholder="할 일 검색 — 번호·제목·내용" autocomplete="off"><div id="mpp-list" class="mpp-list"></div><p class="mpp-hint">↑↓ 고르기 · Enter 덧붙이기 · Esc 닫기</p></div>';
    document.body.appendChild(bg);
    bg.addEventListener('click',function(e){if(e.target===bg)mpClosePicker();});
    document.getElementById('mpp-q').addEventListener('input',function(){MPP.idx=0;mpRenderPicker();});
    document.getElementById('mpp-q').addEventListener('keydown',function(e){
      if(e.isComposing) return;
      if(e.key==='ArrowDown'){e.preventDefault();MPP.idx=Math.min(MPP.idx+1,MPP.list.length-1);mpRenderPicker();}
      else if(e.key==='ArrowUp'){e.preventDefault();MPP.idx=Math.max(MPP.idx-1,0);mpRenderPicker();}
      else if(e.key==='Enter'){e.preventDefault();var t=MPP.list[MPP.idx];if(t)mpPickTask(t.id);}
      else if(e.key==='Escape'){e.preventDefault();mpClosePicker();}
    });
  }
  bg.classList.add('open');
  var q=document.getElementById('mpp-q'); q.value=''; mpRenderPicker(); setTimeout(function(){q.focus();},30);
}
function mpClosePicker(){var bg=document.getElementById('mp-picker');if(bg)bg.classList.remove('open');}
function mpRenderPicker(){
  var r=MP.rows.filter(function(x){return x.id===MPP.rowId;})[0]; if(!r) return;
  var q=(document.getElementById('mpp-q').value||'').trim().toLowerCase();
  // 항목 글에 나온 두 글자 이상 낱말이 할 일 제목·설명에 몇 개 겹치나로 먼저 보여 준다
  var words=((r.hl||'')+' '+(r.body||'')+' '+(r.who||'')).toLowerCase().split(/[^0-9a-z가-힣]+/).filter(function(w){return w.length>=2;});
  var open=(allData._autolab||[]).filter(function(i){return i.person===MP.person&&!(autolabChecks[alKey(i)]||{}).checked;});
  var scored=open.map(function(i){var hay=(i.task+' '+(i.description||'')).toLowerCase();
    var s=words.reduce(function(n,w){return n+(hay.indexOf(w)>=0?1:0);},0)+(String(i.id)===String(r.task_id)?100:0);
    return {i:i,s:s,hay:hay};});
  if(q){ scored=scored.filter(function(x){return ('#'+x.i.id+' '+x.hay).indexOf(q)>=0;});
    scored.forEach(function(x){ if(('#'+x.i.id+' '+x.i.task).toLowerCase().indexOf(q)>=0) x.s+=1000; }); }
  scored.sort(function(a,b){return b.s-a.s||Number(b.i.id)-Number(a.i.id);});
  MPP.list=scored.slice(0,12).map(function(x){return x.i;});
  document.getElementById('mpp-list').innerHTML=MPP.list.map(function(t,n){
    var p=t.parentId?_alFind(t.parentId):null;
    var first=(t.description||'').split('\n').map(function(s){return s.trim();}).filter(function(s){return s&&!/^\[|^\(|^https?:/.test(s);})[0]||'';
    return '<button class="mpp-item'+(n===MPP.idx?' on':'')+'" onclick="mpPickTask(\''+t.id+'\')"><b>#'+t.id+' '+_alEsc(t.task)+'</b>'+
      (String(t.id)===String(r.task_id)?' <span class="mpp-bot">봇 제안</span>':'')+
      '<small>'+(p?'↳ '+_alEsc(p.task)+' · ':'')+_alEsc(first.slice(0,70))+'</small></button>';}).join('')||'<p class="mpp-hint">맞는 할 일이 없습니다. [할 일에 넣기]로 새로 만드세요.</p>';
}
function mpPickTask(taskId){
  var t=_alFind(taskId); mpClosePicker();
  mpDecide(MPP.rowId,'merge','#'+taskId+'에 덧붙이기',Number(taskId));
}


// =============================================
// 큰 주제(상위 할 일) — 목록·매트릭스·상세 창에서 보이고 상세 창에서 바꾼다
// =============================================
function _alFind(id){return (allData._autolab||[]).find(function(i){return String(i.id)===String(id);});}
function _alEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function parentTagHtml(item){
  if(!item.parentId) return '';
  var p=_alFind(item.parentId); if(!p) return '';
  return '<div class="parent-tag" onclick="event.stopPropagation();openAutolabDetailModal(\''+p.id+'\')" title="큰 주제 열기">↳ '+_alEsc(p.task)+'</div>';
}
function waitTagHtml(item){
  if(!item.waitingOn) return '';
  var today=dk(new Date()), due=item.recheckDate&&item.recheckDate<=today;
  return '<div class="wait-tag'+(due?' due':'')+'">기다림 · '+_alEsc(item.waitingOn)+(item.recheckDate?' · '+item.recheckDate.slice(5).replace('-','/')+(due?' 다시 볼 날':' 확인'):'')+'</div>';
}
function familyHtml(item){
  var html='';
  var p=item.parentId?_alFind(item.parentId):null;
  if(p) html+='<div class="family-row"><span>큰 주제</span><button class="family-link" onclick="openAutolabDetailModal(\''+p.id+'\')">#'+p.id+' '+_alEsc(p.task)+'</button></div>';
  var kids=(allData._autolab||[]).filter(function(i){return String(i.parentId)===String(item.id);});
  if(kids.length){
    var doneN=kids.filter(function(k){var a=autolabChecks[alKey(k)]||{};return !!a.checked;}).length;
    html+='<div class="family-row"><span>하위 '+doneN+'/'+kids.length+' 완료</span><div class="family-kids">'+kids.map(function(k){var a=autolabChecks[alKey(k)]||{};
      return '<button class="family-link'+(a.checked?' done':'')+'" onclick="openAutolabDetailModal(\''+k.id+'\')">#'+k.id+' '+_alEsc(k.task)+(k.dueDate?' · '+k.dueDate.slice(5).replace('-','/'):'')+'</button>';}).join('')+'</div></div>';
  }
  return html?'<div class="family">'+html+'</div>':'';
}
function fillParentSelect(item){
  var sel=document.getElementById('dm-parent-select'); if(!sel) return;
  var hasKids=(allData._autolab||[]).some(function(i){return String(i.parentId)===String(item.id);});
  // 한 단계만: 큰 주제는 다른 큰 주제 밑에 못 들어가고, 하위 할 일은 큰 주제 후보가 될 수 없다
  var cands=(allData._autolab||[]).filter(function(i){
    var a=autolabChecks[alKey(i)]||{};
    return i.person===item.person&&String(i.id)!==String(item.id)&&!i.parentId&&!a.checked;
  }).sort(function(a,b){return Number(b.id)-Number(a.id);});
  sel.innerHTML='<option value="">큰 주제 없음</option>'+(hasKids?'':cands.map(function(c){return '<option value="'+c.id+'">↳ #'+c.id+' '+_alEsc(c.task.length>28?c.task.slice(0,28)+'…':c.task)+'</option>';}).join(''));
  sel.value=item.parentId||'';
  sel.disabled=hasKids; sel.title=hasKids?'하위 할 일이 있는 큰 주제는 다른 주제 밑에 넣을 수 없습니다':'';
}

// =============================================
// 실시간 반영 — 다른 창(DM 버튼·정할 것·다른 사람 화면)에서 바뀌면 이 화면도 다시 그린다
// 입력 중이거나 상세 창을 고치는 중이면 끝날 때까지 미룬다
// =============================================
(function(){
  if(!_sb.channel) return;
  var timer=null;
  function editing(){
    var a=document.activeElement;
    if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
    var bg=document.getElementById('detail-modal-bg'), eh=document.getElementById('dm-edit-header');
    if(bg&&bg.classList.contains('open')&&eh&&eh.style.display!=='none') return true;
    return (typeof MP!=='undefined'&&MP.busy);
  }
  function soon(){
    clearTimeout(timer);
    timer=setTimeout(function(){
      if(editing()){soon();return;}
      // 다시 읽은 뒤 열려 있는 상세 창도 새 데이터로 다시 그린다(저장 직후 옛 데이터로 덮이는 경우 방지)
      Promise.resolve(loadData(true)).then(function(){
        var bg=document.getElementById('detail-modal-bg');
        if(bg&&bg.classList.contains('open')&&detailModalId&&!editing()) openAutolabDetailModal(detailModalId);
      });
      if(currentTab==='morning') loadMorning(true);
    },800);
  }
  _sb.channel('autolab-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'autolab_task'},soon)
    .on('postgres_changes',{event:'*',schema:'public',table:'autolab_check'},soon)
    .on('postgres_changes',{event:'*',schema:'public',table:'morning_item'},soon)
    .subscribe();
})();

// =============================================
// 일정 — "큰 주제 지도"(Linear 타임라인 방식). 줄 하나 = 큰 주제(또는 날짜 있는 독립 할 일).
// 막대 = 시작일부터 마감(목표)일. 하위는 펼치면 목록, 마감 있는 하위는 막대 위 ◆.
// 막대 몸통을 끌면 날짜 이동, 양 끝을 끌면 시작·마감 조정. 마감 없는 것은 아래 '날짜 없음' 칸 → 끌어다 놓으면 날짜가 생김.
// =============================================
var PL={person:'강희준',daysBack:14,days:56,open:{},drag:null};
function plDay(s){return new Date(s+'T00:00:00');}
function plKey(d){return dk(d);}
function plDone(i){var a=autolabChecks[alKey(i)]||autolabChecks['autolab_'+alKey(i)];return !!(a&&a.checked);}
function plMD(d){return (d.getMonth()+1)+'/'+d.getDate();}
function renderPlan(){
  var box=document.getElementById('plan-content'); if(!box) return;
  var all=(allData._autolab||[]).filter(function(i){return i.person===PL.person;});
  var open=all.filter(function(i){return !plDone(i);});
  var byId={}; all.forEach(function(i){byId[i.id]=i;});
  var kidsAll={}; all.forEach(function(i){if(i.parentId&&byId[i.parentId])(kidsAll[i.parentId]=kidsAll[i.parentId]||[]).push(i);});
  var today=plDay(dk(new Date())), DAY=86400000, span=PL.days;
  var start=new Date(today); start.setDate(start.getDate()-PL.daysBack); start.setDate(start.getDate()-((start.getDay()+6)%7));
  PL.start=start; PL.DAY=DAY;
  var pos=function(d){return (d-start)/DAY/span*100;};
  // 줄 = 열린 큰 주제(하위가 있는 것) + 하위도 상위도 없는 열린 독립 할 일
  var tops=open.filter(function(i){return !(i.parentId&&byId[i.parentId]&&!plDone(byId[i.parentId]));});
  var topics=tops.filter(function(i){return kidsAll[i.id];});
  var solos=tops.filter(function(i){return !kidsAll[i.id];});
  var dated=topics.concat(solos).filter(function(i){return i.dueDate;});
  var undated=topics.concat(solos).filter(function(i){return !i.dueDate;});
  dated.sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);});
  undated.sort(function(a,b){var ka=kidsAll[a.id]?0:1,kb=kidsAll[b.id]?0:1;return ka-kb||Number(b.id)-Number(a.id);});
  var nOver=dated.filter(function(i){return plDay(i.dueDate)<today;}).length;

  var html='<div class="pl-head"><h1>일정</h1>'+
    '<p>큰 주제 <b>'+topics.length+'개</b> · 독립 할 일 '+solos.length+'건 · 날짜가 잡힌 것 <b>'+dated.length+'</b> · 날짜 없음 <b>'+undated.length+'</b>'+(nOver?' · <b class="pl-over-t">마감 지남 '+nOver+'</b>':'')+'</p>'+
    (function(){var cnt={},none=0; topics.forEach(function(t){var a=topicMeta(t).area; if(a) cnt[a]=(cnt[a]||0)+1; else none++;});
      var parts=TOPIC_AREAS.filter(function(a){return cnt[a];}).map(function(a){return areaPill(a)+' '+cnt[a];});
      Object.keys(cnt).forEach(function(a){if(TOPIC_AREAS.indexOf(a)<0) parts.push(areaPill(a)+' '+cnt[a]);});
      if(none) parts.push('<span class="pl-muted">영역 없음 '+none+'</span>');
      return parts.length?'<p class="pl-areas">책임 영역 '+parts.join(' · ')+'</p>':'';})()+
    '<p class="pl-help">막대를 끌면 날짜가 옮겨지고, 막대 양 끝을 끌면 시작·마감이 바뀝니다. 아래 \'날짜 없음\'에서 끌어 올리면 그 날을 마감으로 잡습니다. 큰 주제 이름을 누르면 하위가 펼쳐집니다.</p></div>';
  var ticks='', wk='';
  for(var d=0;d<span;d++){var day=new Date(start.getTime()+d*DAY);
    if(day.getDay()===0||day.getDay()===6) wk+='<div class="pl-wkend" style="left:'+pos(day)+'%;width:'+(100/span)+'%"></div>';
    if(day.getDay()===1) ticks+='<span class="pl-tick" style="left:'+pos(day)+'%">'+plMD(day)+'</span>';}
  var tpos=pos(today)+50/span;
  var layer='<div class="pl-layer">'+wk+'<div class="pl-today" style="left:'+tpos+'%"></div></div>';
  var rows='<div class="pl-row pl-scale"><div class="pl-name">큰 주제 · 할 일</div><div class="pl-track" id="pl-scale-track">'+ticks+'<span class="pl-tick today" style="left:'+tpos+'%;bottom:22px">오늘</span></div></div>';

  var progress=function(i){var k=kidsAll[i.id]||[];if(!k.length) return '';var dn=k.filter(plDone).length;
    return '<span class="pl-prog'+(dn===k.length?' all':'')+'" title="하위 '+dn+'/'+k.length+' 완료"><i style="width:'+Math.round(dn/k.length*100)+'%"></i></span><span class="n">'+dn+'/'+k.length+'</span>';};
  var barHtml=function(i){
    var s=plDay(i.dateKey||dk(new Date())), e=plDay(i.dueDate); if(s>e) s=e;
    var over=e<today, l=pos(s), r=pos(new Date(e.getTime()+DAY));
    var lab=over?Math.round((today-e)/DAY)+'일 지남 · '+plMD(e):plMD(e);
    if(r<=0) return '<span class="pl-lbl over" style="left:0">← '+lab+'</span>';
    var lc=Math.max(0,l), rc=Math.min(100,r);
    var dia=(kidsAll[i.id]||[]).filter(function(c){return c.dueDate;}).map(function(c){var cd=plDay(c.dueDate),p=pos(new Date(cd.getTime()+DAY/2));
      if(p<0||p>100) return ''; var cls=plDone(c)?'done':(cd<today?'over':'');
      return '<span class="pl-dia '+cls+'" style="left:'+p+'%" title="#'+c.id+' '+_alEsc(c.task)+' · '+plMD(cd)+'" onclick="event.stopPropagation();openAutolabDetailModal(\''+c.id+'\')"></span>';}).join('');
    return '<div class="pl-bar'+(over?' over':'')+(kidsAll[i.id]?' topic':'')+'" data-id="'+i.id+'" style="left:'+lc+'%;width:'+Math.max(0.8,rc-lc)+'%">'+
      '<span class="pl-h l" data-edge="l"></span><span class="pl-h r" data-edge="r"></span></div>'+dia+
      '<button class="pl-lbl pl-lbl-btn'+(over?' over':'')+'" style="left:'+Math.min(rc,90)+'%" data-due-for="'+i.id+'" title="마감 바꾸기">'+lab+'</button>';
  };
  var nameHtml=function(i){
    var has=!!kidsAll[i.id], isOpen=!!PL.open[i.id], tm=topicMeta(i), nx=has?topicNext(i,kidsAll[i.id]):null;
    var tip='#'+i.id+' '+i.task+(tm.goal?'\n끝난 모습: '+tm.goal:'')+(nx?'\n다음 할 일: #'+nx.id+' '+nx.task:'');
    return '<div class="pl-name'+(has?' topic':'')+'" data-drop="'+i.id+'">'+
      (has?'<button class="pl-caret" onclick="PL.open[\''+i.id+'\']=!PL.open[\''+i.id+'\'];renderPlan()" aria-label="하위 펼치기">'+(isOpen?'▾':'▸')+'</button>':'<span class="pl-caret-sp"></span>')+
      '<span class="pr pr-'+(i.priority||'none')+'"></span><span class="t" onclick="openAutolabDetailModal(\''+i.id+'\')" title="'+_alEsc(tip)+'">'+_alEsc(i.task.replace(/\s*\(과제 [567]\)$/,''))+'</span>'+areaPill(tm.area)+(i.waitingOn?'<span class="wait-pill" title="'+_alEsc(i.waitingOn)+' 답 기다림">기다림</span>':'')+progress(i)+'</div>';
  };
  var kidsList=function(i){
    if(!kidsAll[i.id]||!PL.open[i.id]) return '';
    return kidsAll[i.id].slice().sort(function(a,b){return (plDone(a)?1:0)-(plDone(b)?1:0)||(a.dueDate||'9').localeCompare(b.dueDate||'9');}).map(function(c){
      var dn=plDone(c), cd=c.dueDate?plDay(c.dueDate):null;
      return '<div class="pl-row kid'+(dn?' done':'')+'"><div class="pl-name" draggable="true" data-kid="'+c.id+'"><span class="pl-caret-sp"></span><span class="pl-check">'+(dn?'완료':'')+'</span>'+
        '<span class="t" onclick="openAutolabDetailModal(\''+c.id+'\')" title="#'+c.id+' '+_alEsc(c.task)+'">'+_alEsc(c.task)+'</span>'+(c.waitingOn&&!dn?'<span class="wait-pill">기다림</span>':'')+
        (cd?'<span class="pl-due'+(!dn&&cd<today?' over':'')+'">'+plMD(cd)+'</span>':'')+'</div><div class="pl-track"></div></div>';}).join('');
  };
  dated.forEach(function(i){rows+='<div class="pl-row line" data-row="'+i.id+'">'+nameHtml(i)+'<div class="pl-track">'+barHtml(i)+'</div></div>'+kidsList(i);});
  if(!dated.length) rows+='<div class="pl-row line"><div class="pl-name"><span class="pl-help">아직 날짜가 잡힌 큰 주제가 없습니다. 아래에서 끌어 올려 보세요.</span></div><div class="pl-track"></div></div>';
  var lane='<div class="pl-lane"><div class="pl-lane-h">날짜 없음 · '+undated.length+'</div><div class="pl-chips">'+undated.map(function(i){
    var has=!!kidsAll[i.id];
    return '<div class="pl-chip'+(has?' topic':'')+'" draggable="true" data-chip="'+i.id+'" title="끌어서 일정 위에 놓으면 그 날이 마감이 됩니다"><span class="pr pr-'+(i.priority||'none')+'"></span>'+
      '<span class="t" onclick="openAutolabDetailModal(\''+i.id+'\')">'+_alEsc(i.task)+'</span>'+progress(i)+
      '<button class="pl-chip-due" data-due-for="'+i.id+'" title="마감 정하기">마감 정하기</button></div>';}).join('')+'</div></div>';
  var keepX=(document.querySelector('.pl-scroll')||{}).scrollLeft;
  html+='<div class="pl-scroll"><div class="pl-grid" id="pl-grid">'+layer+rows+'</div></div>'+lane;
  box.innerHTML=html;
  // 화면이 좁아 옆으로 밀리면 오늘이 보이게(다시 그릴 때는 보던 자리 유지)
  var sc=document.querySelector('.pl-scroll'), tl=document.querySelector('.pl-today'), nm=document.querySelector('.pl-scale .pl-name');
  if(sc&&tl&&nm&&sc.scrollWidth>sc.clientWidth){ sc.scrollLeft=(keepX!=null&&PL.scrolled)?keepX:Math.max(0,tl.getBoundingClientRect().left-sc.getBoundingClientRect().left-nm.offsetWidth-24); PL.scrolled=true; }
  plWire(byId,kidsAll);
}
// 화면 x좌표 → 날짜
function plDateAt(clientX){
  var tr=document.getElementById('pl-scale-track'); if(!tr) return null;
  var b=tr.getBoundingClientRect(); var f=(clientX-b.left)/b.width; if(f<0||f>1) return null;
  return new Date(PL.start.getTime()+Math.floor(f*PL.days)*PL.DAY);
}
function plWire(byId,kidsAll){
  var grid=document.getElementById('pl-grid'); if(!grid) return;
  var tr=document.getElementById('pl-scale-track'); var dayPx=tr?tr.getBoundingClientRect().width/PL.days:16;
  // 막대 끌기: 몸통=이동, 양 끝=시작·마감
  grid.querySelectorAll('.pl-bar[data-id]').forEach(function(bar){
    bar.addEventListener('pointerdown',function(e){
      if(e.button!==0) return;
      var it=byId[bar.dataset.id]; if(!it) return;
      var edge=e.target.dataset.edge||'move';
      var s0=plDay(it.dateKey||it.dueDate), e0=plDay(it.dueDate); if(s0>e0) s0=e0;
      var x0=e.clientX, left0=parseFloat(bar.style.left), w0=parseFloat(bar.style.width), pct=100/PL.days, moved=false;
      bar.setPointerCapture(e.pointerId); bar.classList.add('dragging');
      function mv(ev){ var dd=Math.round((ev.clientX-x0)/dayPx); if(dd!==0) moved=true;
        if(edge==='move'){bar.style.left=(left0+dd*pct)+'%';}
        else if(edge==='r'){bar.style.width=Math.max(pct,w0+dd*pct)+'%';}
        else {bar.style.left=(left0+dd*pct)+'%';bar.style.width=Math.max(pct,w0-dd*pct)+'%';}
        bar.dataset.dd=dd;
        var ns=new Date(s0), ne=new Date(e0);
        if(edge==='move'){ns.setDate(ns.getDate()+dd);ne.setDate(ne.getDate()+dd);} else if(edge==='r'){ne.setDate(ne.getDate()+dd);} else {ns.setDate(ns.getDate()+dd);}
        var lb=bar.parentNode.querySelector('.pl-lbl'); if(lb){lb.textContent=plMD(ns)+' → '+plMD(ne)+'('+'일월화수목금토'[ne.getDay()]+')';lb.classList.add('live');} }
      function up(ev){ bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); bar.classList.remove('dragging');
        var dd=Number(bar.dataset.dd||0);
        if(!moved||!dd){ if(!moved) openAutolabDetailModal(it.id); return; }
        var ns=new Date(s0), ne=new Date(e0);
        if(edge==='move'){ns.setDate(ns.getDate()+dd);ne.setDate(ne.getDate()+dd);}
        else if(edge==='r'){ne.setDate(ne.getDate()+dd); if(ne<ns) ne=new Date(ns);}
        else {ns.setDate(ns.getDate()+dd); if(ns>ne) ns=new Date(ne);}
        plSetDates(it,plKey(ns),plKey(ne)); }
      bar.addEventListener('pointermove',mv); bar.addEventListener('pointerup',up);
    });
  });
  // 날짜 없음 → 일정 위에 놓기 / 하위 → 다른 큰 주제 이름 위에 놓기
  document.querySelectorAll('[data-chip],[data-kid]').forEach(function(el){
    el.addEventListener('dragstart',function(e){PL.drag={id:el.dataset.chip||el.dataset.kid,kind:el.dataset.chip?'chip':'kid'};try{e.dataTransfer.setData('text/plain',PL.drag.id);}catch(_){} e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',function(){PL.drag=null;document.querySelectorAll('.drop-over').forEach(function(x){x.classList.remove('drop-over');});});
  });
  grid.addEventListener('dragover',function(e){ if(!PL.drag) return; e.preventDefault();
    var nm=e.target.closest('[data-drop]'); document.querySelectorAll('.drop-over').forEach(function(x){if(x!==nm)x.classList.remove('drop-over');});
    if(nm){ nm.classList.add('drop-over'); plGuide(null); } else { grid.classList.add('drop-over'); plGuide(plDateAt(e.clientX)); } });
  grid.addEventListener('dragend',function(){plGuide(null);});
  grid.addEventListener('dragleave',function(e){ if(e.target===grid) grid.classList.remove('drop-over'); });
  grid.addEventListener('drop',function(e){ if(!PL.drag) return; e.preventDefault(); var d=PL.drag; PL.drag=null; plGuide(null);
    document.querySelectorAll('.drop-over').forEach(function(x){x.classList.remove('drop-over');});
    var it=byId[d.id]; if(!it) return;
    var nm=e.target.closest('[data-drop]');
    if(nm){ plReparent(it,nm.dataset.drop,kidsAll); return; }   // 이름 위 = 그 큰 주제 밑으로
    var day=plDateAt(e.clientX); if(!day) return;                // 날짜 칸 위 = 그 날을 마감으로
    plSetDates(it,plStartFor(it,day),plKey(day)); });
  // 마감 글자·[마감 정하기] → 날짜 고르기 창
  document.querySelectorAll('[data-due-for]').forEach(function(b){ b.addEventListener('pointerdown',function(e){e.stopPropagation();});
    b.addEventListener('click',function(e){ e.stopPropagation(); var it=byId[b.dataset.dueFor]; if(!it) return;
      duePicker(b,it.dueDate,function(v){ if(!v){ plSetDates(it,it.dateKey,null); return; } plSetDates(it,plStartFor(it,plDay(v)),v); }); }); });
}
async function plSetDates(it,s,e){
  var upd={due_date:e||null}; if(s) upd.start_date=s;
  var res=await _sb.from('autolab_task').update(upd).eq('id',Number(it.id));
  if(res.error){showToast('날짜 저장 실패: '+res.error.message);renderPlan();return;}
  if(s) it.dateKey=s; it.dueDate=e||''; renderPlan();
  showToast(e?'#'+it.id+' 마감 '+e.slice(5).replace('-','/')+'('+'일월화수목금토'[plDay(e).getDay()]+')':'#'+it.id+' 마감 지움');
}
// 처음 마감을 잡을 때 시작일: 옛 등록일이 2주 넘게 앞이면 오늘로 당긴다(막대가 과거로 길게 늘어지지 않게)
function plStartFor(it,due){
  var today=plDay(dk(new Date())), s=it.dateKey?plDay(it.dateKey):today;
  if(!it.dueDate&&(today-s)/86400000>14) s=today;
  if(s>due) s=due;
  return plKey(s);
}
function plGuide(day){
  var lay=document.querySelector('.pl-layer'); if(!lay) return;
  var g=document.getElementById('pl-guide');
  if(!day){ if(g) g.remove(); return; }
  if(!g){ g=document.createElement('div'); g.id='pl-guide'; g.className='pl-guide'; lay.appendChild(g); }
  g.style.left=((day-PL.start)/PL.DAY/PL.days*100+50/PL.days)+'%';
  g.setAttribute('data-label',plMD(day)+'('+'일월화수목금토'[day.getDay()]+')');
}
// 날짜 고르기 창 — 자주 쓰는 날을 버튼으로(Linear 마감 선택처럼). 일정·상세 창이 같이 쓴다
function duePresets(){
  var t=new Date(); t.setHours(0,0,0,0);
  var add=function(n){var d=new Date(t);d.setDate(d.getDate()+n);return d;};
  var dow=t.getDay(); // 0=일
  var thisFri=add(((5-dow)+7)%7); if(dow===6||dow===0) thisFri=add(((5-dow)+7)%7);
  var nextMon=add(((1-dow)+7)%7||7), nextFri=new Date(nextMon); nextFri.setDate(nextFri.getDate()+4);
  var endM=new Date(t.getFullYear(),t.getMonth()+1,0);
  return [['오늘',t],['내일',add(1)],['이번 주 금',thisFri],['다음 주 월',nextMon],['다음 주 금',nextFri],['2주 뒤',add(14)],['이번 달 말',endM]];
}
function duePicker(anchor,current,onPick){
  var old=document.getElementById('due-pop'); if(old) old.remove();
  var pop=document.createElement('div'); pop.id='due-pop'; pop.className='due-pop';
  var w='일월화수목금토';
  pop.innerHTML='<div class="due-pop-h">마감 고르기</div>'+duePresets().map(function(p){return '<button data-v="'+dk(p[1])+'"><span>'+p[0]+'</span><small>'+(p[1].getMonth()+1)+'/'+p[1].getDate()+' '+w[p[1].getDay()]+'</small></button>';}).join('')+
    '<label class="due-pop-cal">날짜 직접 <input type="date" value="'+(current||'')+'"></label>'+(current?'<button class="due-pop-clear" data-v="">마감 지우기</button>':'');
  document.body.appendChild(pop);
  var r=anchor.getBoundingClientRect(), top=r.bottom+6, left=Math.min(r.left,window.innerWidth-pop.offsetWidth-12);
  if(top+pop.offsetHeight>window.innerHeight-8) top=Math.max(8,r.top-pop.offsetHeight-6);
  pop.style.top=top+'px'; pop.style.left=Math.max(8,left)+'px';
  var close=function(){pop.remove();document.removeEventListener('pointerdown',outside,true);};
  var outside=function(e){if(!pop.contains(e.target)&&e.target!==anchor)close();};
  setTimeout(function(){document.addEventListener('pointerdown',outside,true);},0);
  pop.querySelectorAll('button[data-v]').forEach(function(b){b.onclick=function(){close();onPick(b.dataset.v||null);};});
  pop.querySelector('input[type=date]').onchange=function(e){if(e.target.value){close();onPick(e.target.value);}};
  pop.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
}
async function plReparent(it,parentId,kidsAll){
  if(String(parentId)===String(it.id)) return;
  if(kidsAll[it.id]&&kidsAll[it.id].length){showToast('하위가 있는 큰 주제는 다른 주제 밑에 넣을 수 없습니다');return;}
  var res=await _sb.from('autolab_task').update({parent_id:Number(parentId)}).eq('id',Number(it.id));
  if(res.error){showToast('옮기기 실패: '+res.error.message);return;}
  it.parentId=String(parentId); PL.open[parentId]=true; renderPlan(); showToast('#'+it.id+' → #'+parentId+' 밑으로');
}
// =============================================
// 상세 창을 그 자리에서 고치기(Linear 이슈 화면처럼) — [수정]을 누르지 않아도 바꾸면 바로 저장
// 제목·완료·우선순위·기간·큰 주제·담당, 하위 할 일 체크·추가, 진척 한 줄, 설명은 눌러서 고치기
// =============================================
var DMP_PRIO=[['','미분류'],['DO','긴급+중요'],['SCHEDULE','중요+안긴급'],['DELEGATE','긴급+안중요'],['ELIMINATE','둘다아님']];
var _openDetailOrig=openAutolabDetailModal;
openAutolabDetailModal=function(id){ _openDetailOrig(id); dmEnhance(id); };
function dmItem(id){return _alFind(id);}
function dmIsDone(i){var a=autolabChecks[alKey(i)]||{};return !!a.checked;}
// =============================================
// 큰 주제 머리말 — 설명 맨 위 두 줄 "책임 영역: …" "끝난 모습: …"을 읽고 고친다. 다음 할 일은 하위에서 계산한다.
// =============================================
var TOPIC_AREAS=['과제 5','과제 6','과제 7','운영 기반','영토 밖(상품)'];
function topicMeta(item){
  var d=(item&&item.description)||'', a=d.match(/^책임 영역:[ \t]*(.*)$/m), g=d.match(/^끝난 모습:[ \t]*(.*)$/m);
  return {area:a?a[1].trim():'',goal:g?g[1].trim():''};
}
function topicSetLine(desc,key,val){
  desc=desc||''; var re=new RegExp('^'+key+':[ \\t]*.*(\\n|$)','m');
  if(re.test(desc)) return val?desc.replace(re,function(m,nl){return key+': '+val+nl;}):desc.replace(re,'');
  if(!val) return desc;
  if(key==='끝난 모습'&&/^책임 영역:/m.test(desc)) return desc.replace(/^(책임 영역:.*)$/m,function(m){return m+'\n끝난 모습: '+val;});
  var hasHead=/^(책임 영역|끝난 모습):/m.test(desc);
  return key+': '+val+'\n'+(hasHead?'':'\n')+desc;
}
function topicNext(item,kids){
  var open=(kids||[]).filter(function(k){return !dmIsDone(k);});
  if(!open.length) return null;
  var key=function(k){return (k.waitingOn?'1':'0')+(k.dueDate||'9999');};
  return open.slice().sort(function(a,b){return key(a).localeCompare(key(b));})[0];
}
function areaPill(area){
  if(!area) return '';
  var c=/^과제/.test(area)?'k':(/밖/.test(area)?'out':'base');
  return '<span class="area-pill '+c+'" title="책임 영역">'+_alEsc(area.replace('(상품)',''))+'</span>';
}

  var hasKids=(allData._autolab||[]).some(function(i){return String(i.parentId)===String(item.id);});
  var props='<div class="dmp">'+
    '<div class="dmp-row"><span>상태</span><label class="dmp-done"><input type="checkbox" id="dmp-done"'+(dmIsDone(item)?' checked':'')+'> 완료</label></div>'+
    '<div class="dmp-row"><span>기다림</span>'+(item.waitingOn
      ?'<div class="dmp-wait"><input id="dmp-wait-who" value="'+_alEsc(item.waitingOn)+'" aria-label="누구의 답" placeholder="누구"><span>답 기다림 · '+(item.waitingSince?item.waitingSince.slice(5).replace('-','/')+'부터':'')+'</span><button class="dmp-pick" id="dmp-recheck">다시 볼 날 '+(item.recheckDate?item.recheckDate.slice(5).replace('-','/'):'정하기')+'</button><button class="dmp-x" id="dmp-wait-end">기다림 끝</button></div>'
      :'<div class="dmp-wait"><input id="dmp-wait-who" placeholder="누구의 답을 기다리나요? (예: 이수민 팀장) — 쓰고 Enter" aria-label="기다리는 사람"></div>')+'</div>'+
    '<div class="dmp-row"><span>우선순위</span><div class="dmp-chips">'+DMP_PRIO.map(function(p){return '<button class="dmp-chip p-'+(p[0]||'none')+((item.priority||'')===p[0]?' on':'')+'" data-prio="'+p[0]+'">'+p[1]+'</button>';}).join('')+'</div></div>'+
    '<div class="dmp-row"><span>기간</span><div class="dmp-dates"><input type="date" id="dmp-start" value="'+(item.dateKey||'')+'" aria-label="시작일"><span>→</span><input type="date" id="dmp-due" value="'+(item.dueDate||'')+'" aria-label="마감일"><button class="dmp-pick" id="dmp-due-pick">마감 고르기</button>'+(item.dueDate?'<button class="dmp-x" id="dmp-due-clear" title="마감 지우기">지우기</button>':'')+'</div></div>'+
    '<div class="dmp-row"><span>큰 주제</span><select id="dmp-parent"'+(hasKids?' disabled title="하위가 있는 큰 주제는 다른 주제 밑에 넣을 수 없습니다"':'')+'><option value="">없음</option>'+
      cands.map(function(c){return '<option value="'+c.id+'"'+(String(item.parentId)===String(c.id)?' selected':'')+'>#'+c.id+' '+_alEsc(c.task.length>30?c.task.slice(0,30)+'…':c.task)+'</option>';}).join('')+'</select></div>'+
    '<div class="dmp-row"><span>담당</span><select id="dmp-person">'+['강희준','송민호','안보람'].map(function(p){return '<option'+(item.person===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select></div>'+
  '</div>';

    kids.map(function(k){return '<div class="dmp-kid'+(dmIsDone(k)?' done':'')+'"><input type="checkbox" data-kid="'+k.id+'"'+(dmIsDone(k)?' checked':'')+' aria-label="완료">'+
      '<button class="family-link" onclick="openAutolabDetailModal(\''+k.id+'\')">#'+k.id+' '+_alEsc(k.task)+'</button>'+(k.dueDate?'<span class="dmp-kdue">'+k.dueDate.slice(5).replace('-','/')+'</span>':'')+'</div>';}).join('')+
    (item.parentId?'':'<input id="dmp-addkid" class="dmp-input" placeholder="+ 하위 할 일 추가 (Enter)">')+'</div>';

  if(!item.parentId&&(kids.length||topicMeta(item).area)){

      '<div class="dmp-row"><span>끝난 모습</span><input id="dmp-goal" class="dmp-input" value="'+_alEsc(tm.goal)+'" placeholder="이 주제가 끝나면 어떤 상태인가요? 한 줄 — 쓰고 Enter"></div>'+

    '</div>'+sub;
  }
  var parent=item.parentId?dmItem(item.parentId):null;
  var up=parent?'<div class="dmp-up">↳ 큰 주제 <button class="family-link" onclick="openAutolabDetailModal(\''+parent.id+'\')">#'+parent.id+' '+_alEsc(parent.task)+'</button></div>':'';
  document.getElementById('detail-modal-info').innerHTML=up+props+sub+
    '<input id="dmp-prog" class="dmp-input" placeholder="+ 진척 한 줄 남기기 (Enter) — 설명 끝에 날짜와 함께 붙습니다">';

  dv.classList.add('dmp-desc'); dv.title='눌러서 고치기';

  document.getElementById('dmp-start').onchange=function(e){if(e.target.value) dmSave(item,{start_date:e.target.value},'시작일');};

  var we=document.getElementById('dmp-wait-end'); if(we) we.onclick=function(){dmSave(item,{waiting_on:null,waiting_since:null,recheck_date:null},'기다림 끝');};

  var gl=document.getElementById('dmp-goal');
  if(gl){ gl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();gl.blur();}});
    gl.addEventListener('blur',function(){var v=gl.value.trim(); if(v!==topicMeta(item).goal) dmSave(item,{description:topicSetLine(item.description,'끝난 모습',v)},'끝난 모습');}); }

}
function dmRefresh(reopenId){
  render();
  if(currentTab.startsWith('matrix-')) renderMatrix(currentTab.replace('matrix-',''));
  if(currentTab==='history') renderHistory();
  if(currentTab==='plan') renderPlan();
  if(reopenId&&document.getElementById('detail-modal-bg').classList.contains('open')) openAutolabDetailModal(reopenId);
}
// DB 칸 → 화면 칸
var DMP_MAP={waiting_on:'waitingOn',waiting_since:'waitingSince',recheck_date:'recheckDate',task:'task',priority:'priority',start_date:'dateKey',due_date:'dueDate',parent_id:'parentId',person:'person',description:'description'};
async function dmSave(item,upd,label){
  var res=await _sb.from('autolab_task').update(upd).eq('id',parseInt(item.id));
  if(res.error){showToast(label+' 저장 실패: '+res.error.message);return;}
  Object.keys(upd).forEach(function(k){var v=upd[k]; item[DMP_MAP[k]]=(k==='parent_id'?(v?String(v):null):(v==null?'':v));});
  showToast(label+' 저장됨'); dmRefresh(item.id);
}
async function dmSetDone(item,checked,reopenId){
  var cd=checked?dk(new Date()):'';
  autolabChecks[alKey(item)]={checked:checked,completedDate:cd};
  await upsertCheck('autolab',String(item.id),checked,cd);
  showToast(checked?'#'+item.id+' 완료':'#'+item.id+' 완료 취소');
  // 하위가 모두 끝나면 큰 주제도 완료할지 묻는다(Linear식 자동 완료 — 우선은 묻고 하기)
  var p=item.parentId?dmItem(item.parentId):null;
  if(checked&&p&&!dmIsDone(p)){
    var kids=(allData._autolab||[]).filter(function(i){return String(i.parentId)===String(p.id);});
    if(kids.length&&kids.every(dmIsDone)) showToast('#'+p.id+' 하위가 모두 끝났습니다. 큰 주제도 완료하려면 그 창에서 체크하세요');
  }
  dmRefresh(reopenId||item.id);
}
async function dmAddKid(item,title){
  var today=dk(new Date());
  var res=await _sb.from('autolab_task').insert({person:item.person,task:title,priority:item.priority||'',start_date:today,due_date:null,created_at:today,
    description:'[수동 등록 · '+today+'] 하위 할 일 (상위 #'+item.id+')',parent_id:Number(item.id)}).select().single();
  if(res.error){showToast('하위 추가 실패: '+res.error.message);return;}
  var r=res.data;
  allData._autolab.push({id:String(r.id),dateKey:r.start_date,task:r.task,person:r.person,priority:r.priority||'',dueDate:'',createdAt:r.created_at,description:r.description||'',isOverdue:false,parentId:String(item.id)});
  showToast('하위 #'+r.id+' 추가'); dmRefresh(item.id);
}
async function dmAddProgress(item,text){
  var d=new Date(), line='\n[진척 '+(d.getMonth()+1)+'/'+d.getDate()+' 희준님] '+text;
  var cur=await _sb.from('autolab_task').select('description').eq('id',parseInt(item.id)).single();
  var desc=((cur.data&&cur.data.description)||item.description||'').replace(/\s+$/,'')+line;
  await dmSave(item,{description:desc},'진척');
}
function dmEditDesc(item){
  var dv=document.getElementById('dm-desc-view');
  dv.onclick=null;
  dv.innerHTML='<textarea id="dmp-desc" class="dmp-desc-ta" rows="10"></textarea><div class="dmp-desc-acts"><button class="btn-cancel" id="dmp-desc-cancel">취소</button><button class="btn-save" id="dmp-desc-save">저장</button></div>';
  var ta=document.getElementById('dmp-desc'); ta.value=item.description||''; ta.focus();
  document.getElementById('dmp-desc-cancel').onclick=function(){openAutolabDetailModal(item.id);};
  document.getElementById('dmp-desc-save').onclick=function(){dmSave(item,{description:ta.value},'설명');};
}

// 처리는 전부 Edge Function morning-action 한 곳에서 한다(슬랙 DM 카드와 같은 경로, 카드도 같이 갱신됨)
async function mpCall(body){
  var res=await _sb.functions.invoke('morning-action',{body:body});
  if(res.error) throw res.error;
  return res.data;
}
function mpReplace(row){for(var i=0;i<MP.rows.length;i++){if(MP.rows[i].id===row.id){MP.rows[i]=Object.assign({},row,{grp:MP.rows[i].grp,sort:MP.rows[i].sort});}}}
function mpInputs(){
  var m=document.getElementById('mp-memo'), d=document.getElementById('mp-due'),
      f=document.getElementById('mp-fu'), fd=document.getElementById('mp-fu-due'),
      pr=document.querySelector('input[name="mp-prio"]:checked');
  return {memo:m?m.value.trim():'', due:d&&d.value?d.value:'',
    followup:f&&f.value.trim()?{task:f.value.trim(),due:fd&&fd.value?fd.value:''}:null,
    priority:pr?pr.value:''};
}
var MP_KEYS={add:'2',done:'4',later:'H'};
async function mpDecide(id,k,label,taskId){
  if(MP.busy) return;
  var inp=mpInputs(); MP.busy=true; renderMorning();
  try{
    var out=await mpCall({id:id,action:k,label:label,by:MP.person,via:'dashboard',memo:inp.memo,due:inp.due,followup:inp.followup,priority:inp.priority,task_id:taskId||null});
    if(out.already){showToast('이미 정한 항목: '+out.row.decision_label);mpReplace(out.row);return;}
    if(!out.ok) throw new Error(out.error||'처리 실패');
    mpReplace(out.row);
    var next=MP.rows.filter(function(x){return mpAct(x)&&!x.decision;})[0];
    if(next) MP.sel=next.id;
    showToast(label+(out.row.decided_task_id?' · #'+out.row.decided_task_id:''));
    if(k==='add'||k==='merge'||k==='done') loadData();
  }catch(e){showToast('실패: '+(e.message||e));}
  finally{MP.busy=false;renderMorning();}
}
async function mpMemo(id){
  if(MP.busy) return;
  var inp=mpInputs(); if(!inp.memo&&!inp.followup){showToast('메모나 후속 할 일을 입력하세요');return;}
  MP.busy=true; renderMorning();
  try{
    var out=await mpCall({id:id,action:'memo',memo:inp.memo,due:inp.due,followup:inp.followup,priority:inp.priority});
    if(!out.ok) throw new Error(out.error||'메모 실패');
    mpReplace(out.row); showToast('메모 덧붙임'+(out.row.decided_task_id?' · #'+out.row.decided_task_id:'')); loadData();
  }catch(e){showToast('실패: '+(e.message||e));}
  finally{MP.busy=false;renderMorning();}
}
async function mpUndo(id){
  if(MP.busy) return; MP.busy=true; renderMorning();
  try{
    var out=await mpCall({id:id,action:'undo'});
    if(!out.ok) throw new Error(out.error||'되돌리기 실패');
    mpReplace(out.row); MP.sel=id;
    showToast('되돌림'); loadData();
  }catch(e){showToast('실패: '+(e.message||e));}
  finally{MP.busy=false;renderMorning();}
}
// =============================================
// ⌘Z 되돌리기 — 화면에서 바꾼 것을 바로 앞 상태로. 할 일 표 바꾸기·넣기·지우기, 완료 체크, 정할 것 결정.
// 모든 쓰기를 DB로 보내기 직전에 잡아 이전 값을 기억한다. 한 번 누른 동작(0.5초 안 묶음)이 한 단계.
// 글 입력 칸 안에서는 브라우저 기본 ⌘Z(글자 되돌리기)를 그대로 둔다.
// =============================================
var UNDO={stack:[],replaying:false,lastPush:0,max:50};
var UNDO_MAP={task:'task',priority:'priority',start_date:'dateKey',due_date:'dueDate',description:'description',person:'person',parent_id:'parentId',waiting_on:'waitingOn',waiting_since:'waitingSince',recheck_date:'recheckDate'};
function undoPush(label,fn){
  if(UNDO.replaying) return;
  var now=Date.now(), top=UNDO.stack[UNDO.stack.length-1];
  if(top&&now-UNDO.lastPush<500){ top.fns.push(fn); top.label=top.label||label; }
  else { UNDO.stack.push({label:label,fns:[fn]}); if(UNDO.stack.length>UNDO.max) UNDO.stack.shift(); }
  UNDO.lastPush=now;
}
function _undoPrev(id,upd){
  var it=_alFind(id); if(!it) return null;
  var prev={}; Object.keys(upd).forEach(function(k){ if(!(k in UNDO_MAP)) return; var v=it[UNDO_MAP[k]];
    prev[k]=(v===''||v===undefined)?null:(k==='parent_id'&&v?Number(v):v); });
  return prev;
}
function _undoRowFromItem(it){
  return {person:it.person,task:it.task,priority:it.priority||'',start_date:it.dateKey||dk(new Date()),due_date:it.dueDate||null,created_at:(it.createdAt||dk(new Date())).slice(0,10),
    description:it.description||'',parent_id:it.parentId?Number(it.parentId):null,waiting_on:it.waitingOn||null,waiting_since:it.waitingSince||null,recheck_date:it.recheckDate||null};
}
(function(){
  var origFrom=_sb.from.bind(_sb);
  _sb.from=function(table){
    var b=origFrom(table);
    if(table!=='autolab_task') return b;
    var oUpdate=b.update.bind(b), oInsert=b.insert.bind(b), oDelete=b.delete.bind(b);
    b.update=function(upd){ var q=oUpdate(upd), oEq=q.eq.bind(q);
      q.eq=function(col,val){ if(col==='id'&&!UNDO.replaying){ var prev=_undoPrev(val,upd); if(prev&&Object.keys(prev).length)
          undoPush('#'+val+' 변경',function(){return origFrom('autolab_task').update(prev).eq('id',Number(val));}); }
        return oEq(col,val); };
      return q; };
    b.insert=function(rows){ var q=oInsert(rows), oThen=q.then.bind(q);
      q.then=function(ok,bad){ return oThen(function(r){ if(r&&r.data&&!UNDO.replaying){ [].concat(r.data).forEach(function(row){ if(row&&row.id)
            undoPush('#'+row.id+' 추가',function(){return Promise.all([origFrom('autolab_task').delete().eq('id',Number(row.id)),origFrom('autolab_check').delete().eq('type','autolab').eq('item_key',String(row.id))]);}); }); }
          return ok?ok(r):r; },bad); };
      return q; };
    b.delete=function(){ var q=oDelete(), oEq=q.eq.bind(q);
      q.eq=function(col,val){ if(col==='id'&&!UNDO.replaying){ var it=_alFind(val); if(it){ var row=_undoRowFromItem(it), chk=autolabChecks[alKey(it)];
          undoPush('#'+val+' 삭제',async function(){ var r=await origFrom('autolab_task').insert(row).select('id').single();
            if(r.data&&chk&&chk.checked) await _sb.from('autolab_check').upsert({type:'autolab',item_key:String(r.data.id),checked:true,completed_date:chk.completedDate||''},{onConflict:'item_key'});
            if(r.data) showToast('#'+val+' 다시 살림 → 새 번호 #'+r.data.id); }); } }
        return oEq(col,val); };
      return q; };
    return b;
  };
  // 완료 체크
  var origUpsert=upsertCheck;
  upsertCheck=async function(type,itemKey,checked,completedDate){
    if(!UNDO.replaying&&type==='autolab'){ var prev=(autolabChecks['autolab_'+itemKey])||{checked:false,completedDate:''};
      var wasChecked=!!prev.checked, wasDate=prev.completedDate||'';
      // 화면이 저장 전에 상태를 먼저 바꿔 두는 경우가 있어, 같아 보이면 반대 상태를 이전 값으로 본다
      if(wasChecked===!!checked){ wasChecked=!checked; wasDate=''; }
      undoPush('#'+itemKey+(checked?' 완료':' 완료 취소'),function(){ autolabChecks['autolab_'+itemKey]={checked:wasChecked,completedDate:wasDate}; return origUpsert(type,itemKey,wasChecked,wasDate); }); }
    return origUpsert(type,itemKey,checked,completedDate);
  };
})();
// 정할 것 결정도 한 단계로(처리 함수가 할 일까지 같이 되돌린다)
var _mpDecideOrig=mpDecide;
mpDecide=async function(id,k,label,taskId){
  await _mpDecideOrig(id,k,label,taskId);
  var r=(MP.rows||[]).find(function(x){return x.id===id;});
  if(r&&r.decision&&!UNDO.replaying){ UNDO.stack.push({label:'정할 것 "'+(r.hl||'').slice(0,20)+'" 결정',fns:[function(){return mpCall({id:id,action:'undo'});}]}); UNDO.lastPush=Date.now()-600; }
};
async function undoLast(){
  var g=UNDO.stack.pop(); if(!g){ showToast('되돌릴 것이 없습니다'); return; }
  UNDO.replaying=true;
  try{ for(var i=g.fns.length-1;i>=0;i--){ await g.fns[i](); } }
  catch(e){ showToast('되돌리기 실패: '+(e.message||e)); }
  finally{ UNDO.replaying=false; }
  await loadData(true);
  if(currentTab==='morning') await loadMorning(true);
  if(document.getElementById('detail-modal-bg').classList.contains('open')&&detailModalId){
    if(_alFind(detailModalId)) openAutolabDetailModal(detailModalId); else closeDetailModal(); }
  showToast('되돌림: '+g.label+(UNDO.stack.length?' · 더 누르면 그 전으로':''));
}
document.addEventListener('keydown',function(e){
  if(!(e.metaKey||e.ctrlKey)||e.shiftKey||e.altKey||String(e.key).toLowerCase()!=='z') return;
  var a=document.activeElement;
  if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable)) return; // 글자 되돌리기는 브라우저에 맡김
  e.preventDefault(); undoLast();
});
// 바꾼 직후 알림에 되돌리는 법을 붙인다
var _toastOrig=showToast;
showToast=function(msg){ var hint=(!UNDO.replaying&&Date.now()-UNDO.lastPush<1500&&UNDO.stack.length&&!/되돌/.test(msg))?' · ⌘Z 되돌리기':''; _toastOrig(msg+hint); };

</script>
